<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Il drama della festa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one card per screen, phone-first, nothing scrolls; a sticker shelf is the home. Blue+turquoise world, pink only on lesson words, gold for the stretch. */
:root{
  --bg:#EAF4FB; --card:#FFFFFF; --fg:#17304A; --mute:#5B7185; --line:#CFE0EE;
  --blue:#1E63D6; --blue-fg:#FFFFFF; --turq:#17B3A6; --turq-soft:#DDF6F3;
  --pink:#E8338C; --pink-soft:#FDE4F0; --gold:#D79A1E; --gold-soft:#FFF1CC;
  --ok:#1E9E5A; --ok-soft:#DDF5E7; --bad:#E8338C; --heart:#F0497A;
  --display:'Fredoka','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,sans-serif;
  --r:22px; --shadow:0 6px 18px rgba(23,48,74,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101C2A;--card:#182838;--fg:#EEF5FB;--mute:#A9BCCD;--line:#2B4258;--turq-soft:#153B3A;--pink-soft:#4A1C33;--gold-soft:#4A3A12;--ok-soft:#153B29;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101C2A;--card:#182838;--fg:#EEF5FB;--mute:#A9BCCD;--line:#2B4258;--turq-soft:#153B3A;--pink-soft:#4A1C33;--gold-soft:#4A3A12;--ok-soft:#153B29;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.35;font-weight:700}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top{display:flex;align-items:center;gap:10px;min-height:48px}
.top .back{font-family:var(--display);font-weight:600;font-size:18px;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.top .sp{flex:1}
.hud{display:flex;gap:8px;align-items:center;font-family:var(--display);font-size:17px}
.hud .pill{background:var(--card);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.hearts i{display:inline-block;width:16px;height:16px;background:var(--heart);clip-path:path('M8 15 L1.5 8.5 A4 4 0 0 1 8 3.5 A4 4 0 0 1 14.5 8.5 Z');margin-right:2px;opacity:.25}
.hearts i.on{opacity:1}
.crumb{font-size:15px;color:var(--mute);font-weight:800;margin:6px 2px 4px;display:flex;justify-content:space-between;gap:10px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 2px 8px}
.bar i{display:block;height:100%;background:var(--turq);width:0;transition:width .3s}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:auto}
.kick{font-size:15px;color:var(--mute);letter-spacing:.02em;text-transform:uppercase;font-weight:800}
.work{font-size:15px;color:var(--mute);font-weight:700}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px}h2{font-size:24px}
.prompt{font-family:var(--display);font-size:28px;font-weight:600}
.prompt .pk,h1 .pk{color:var(--pink)}
.sub{color:var(--mute);font-size:17px}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:10px 14px;font-size:20px;font-weight:800;text-align:left;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.no{background:var(--pink-soft);border-color:var(--pink);color:var(--pink)}
.opt.show{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.opt[disabled]{cursor:default}
.tip{border-radius:16px;background:var(--turq-soft);padding:12px 14px;font-size:17px;display:flex;gap:10px;align-items:flex-start}
.tip b{font-family:var(--display);font-weight:600;display:block;font-size:18px}
.tip img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:top;flex:none;background:var(--card)}
.tip.bad{background:var(--pink-soft)}
.prof{display:flex;gap:12px;align-items:flex-end}
.prof img{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:top;background:var(--turq-soft);flex:none}
.bubble{background:var(--turq-soft);border-radius:18px;padding:12px 14px;font-size:19px;position:relative;flex:1}
.bubble small{display:block;color:var(--mute);font-size:15px;margin-top:3px}
.btn{font-family:var(--display);font-weight:600;font-size:21px;min-height:56px;border-radius:18px;padding:10px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--blue);color:var(--blue-fg)}
.btn.g{background:var(--card);border:2px solid var(--line)}
.btn.gold{background:var(--gold);color:#2B1D00}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.chat{background:var(--bg);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:19px;background:var(--card);box-shadow:var(--shadow);cursor:pointer}
.msg.me{align-self:flex-end;background:var(--blue);color:var(--blue-fg)}
.msg small{display:block;font-size:15px;opacity:.8;margin-top:2px;font-weight:700}
.msg.me small{color:#DDEBFF}
.who{font-size:14px;color:var(--mute);font-weight:800}
.rule{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font-size:20px}
.rule .pk{color:var(--pink);font-family:var(--display);font-size:24px;font-weight:600}
.tricks{background:var(--turq-soft);border-radius:16px;padding:12px 14px;font-size:17px}
.tricks div{display:flex;gap:10px;margin:4px 0}
.tricks span.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--card);font-size:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-height:50px;padding:8px 14px;border-radius:14px;font-size:20px;font-weight:800;border:2px solid var(--line);background:var(--card)}
.tile.used{opacity:.25;cursor:default}
.built{min-height:60px;border-radius:16px;border:2px dashed var(--line);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.built .tile{background:var(--pink-soft);border-color:var(--pink)}
input.ans{font:inherit;font-size:22px;font-weight:800;width:100%;min-height:58px;border-radius:16px;border:2px solid var(--line);padding:10px 14px;background:var(--card);color:var(--fg)}
.acc{display:flex;gap:6px;flex-wrap:wrap}
.acc button{min-width:44px;min-height:40px;border-radius:10px;border:2px solid var(--line);font-size:20px;font-weight:800}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.bank span{background:var(--bg);border-radius:10px;padding:4px 10px;font-size:16px}
.bank button{background:var(--bg);border:2px solid var(--line);border-radius:12px;min-height:44px;padding:6px 12px;font:inherit;font-size:17px;font-weight:700;color:inherit}
.bank button:active{border-color:var(--ink,#16355c)}
.pen{font-size:16px;color:var(--mute);margin-top:4px}
.hear{width:100%;min-height:92px;border-radius:18px;background:var(--turq-soft);display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-size:22px;font-weight:600}
.hear svg{width:40px;height:40px}
/* home */
.home{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:auto}
.hero{display:flex;gap:12px;align-items:center}
.hero img{width:110px;height:110px;border-radius:50%;object-fit:cover;object-position:top;background:var(--card);box-shadow:var(--shadow)}
.hero .t small{display:block;color:var(--mute);font-size:16px}
.shelf{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.shelf .kick{margin-bottom:6px}
.stk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stk .s{aspect-ratio:1;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;border:2px dashed var(--line)}
.stk .s.got{border-style:solid;border-color:var(--turq);background:var(--turq-soft)}
.stk .s.gold.got{border-color:var(--gold);background:var(--gold-soft)}
.stk svg{width:78%;height:78%}
.stops{display:flex;flex-direction:column;gap:8px}
.stop{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;text-align:left;width:100%}
.stop .n{width:40px;height:40px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:19px;flex:none}
.stop.cur .n{background:var(--blue);color:var(--blue-fg)}
.stop.done .n{background:var(--turq);color:#fff}
.stop.gold .n{background:var(--gold-soft);color:#6B4A00}
.stop.lock{opacity:.5}
.stop .l{flex:1;font-size:19px;font-weight:800}.stop .l small{display:block;color:var(--mute);font-size:15px;font-weight:700}
.big{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;color:var(--blue)}
.scorecard{border:3px solid var(--blue);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.scorecard .k{font-size:15px;color:var(--mute);text-transform:uppercase;letter-spacing:.02em}
.shot{background:var(--pink-soft);border-radius:16px;padding:12px 14px;font-size:17px}
.center{text-align:center;align-items:center}
.streak{color:var(--gold)}
/* scene / dub */
.phone{background:#0E1A2B;border-radius:28px;padding:14px 12px 12px;color:#fff;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;position:relative}
.phone .ph-top{display:flex;align-items:center;justify-content:space-between;font-family:var(--display);font-size:16px;color:#B9CCE0}
.phone .ph-top b{color:#fff}
.sc-stage{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.sc-avs{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.sc-avs .nm{font-family:var(--display);font-size:15px;color:#B9CCE0;text-align:center;margin-top:2px}
.sc-av{width:72px;height:72px;border-radius:50%;overflow:hidden;background:#1E2E44;flex:none;border:3px solid transparent;transition:transform .2s,border-color .2s;margin:0 auto}
.sc-av img{width:100%;height:auto;transform:scale(1.7);transform-origin:50% 27%}
.sc-av.on{border-color:var(--pink);transform:scale(1.08)}
.sc-av.me{border-color:var(--turq)}
.sc-lines{flex:1;min-height:120px;max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.sc-l{max-width:86%;padding:9px 12px;border-radius:16px;background:#223449;font-size:19px;line-height:1.25;opacity:.45;cursor:pointer;border:2px solid transparent}
.sc-l.b{align-self:flex-end;background:var(--blue)}
.sc-l.seen{opacity:1}
.sc-l.now{border-color:var(--pink);opacity:1;box-shadow:0 0 0 3px rgba(232,51,140,.25)}
.sc-l.mine{border-style:dashed;border-color:var(--turq)}
.sc-l small{display:block;font-size:15px;color:#B9CCE0;margin-top:2px}
.sc-ctl{display:flex;gap:8px;flex-wrap:wrap}
.sc-ctl .btn{flex:1;min-height:50px;font-size:18px}
.phone .btn.g,.phone span.btn.g,.phone a.btn.g{background:#223449;color:#fff;border-color:#3A4D66}
.phone .sub{color:#B9CCE0}
.mic{width:14px;height:14px;border-radius:50%;background:var(--pink);display:inline-block;margin-right:8px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolepick button{border-radius:18px;border:3px solid var(--line);background:var(--card);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-size:19px;font-weight:600}
.rolepick button.on{border-color:var(--pink);background:var(--pink-soft)}
.rolepick img{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 8%;transform:scale(1.0)}
.rolepick .av{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--bg)}
.rolepick .av img{width:100%;height:auto;transform:scale(1.7);transform-origin:50% 27%}
/* vero o falso */
.vf-card{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:var(--r);background:var(--pink-soft);padding:18px;text-align:center}
.vf-word{font-family:var(--display);font-size:42px;font-weight:700;line-height:1.05}
.vf-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf-btns .btn{min-height:64px;font-size:24px}
.vf-ok{background:var(--ok-soft)!important}.vf-no{background:var(--pink-soft)!important}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-height:700px){.prompt{font-size:24px}.opt{min-height:50px;font-size:18px}.prof img{width:72px;height:72px}body{font-size:17px}}
</style>

function norm(s){return s.toLowerCase().replace(/[’']/g,'’').replace(/[?.!,;:]/g,'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim()}
function ed(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++){var c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
var GRAMMAR=G.grammar.concat(Object.keys(INF)).concat(IDS).concat(IRIDS); // never fuzzy-match these
function wordOk(got,want){if(got===want)return true;if(GRAMMAR.indexOf(want)!==-1||GRAMMAR.indexOf(got)!==-1)return false;return want.length>=4&&ed(got,want)<=1}
function sentOk(typed,answer){var a=norm(typed).split(' '),b=norm(answer).split(' ');if(a.length!==b.length)return false;for(var i=0;i<a.length;i++)if(!wordOk(a[i],b[i]))return false;return true}

function provaSubmit(){var inp=app.querySelector('#ans');var typed=inp?inp.value:'';var qi=pv.q[pv.i];var PQ=G.resolve?G.resolve(PROVA[qi]):PROVA[qi];var ok=[PQ[1]].concat(PQ[2]||[]).some(function(x){return sentOk(typed,x)});pv.log.push({i:qi,typed:typed,ok:ok,hint:!!pv.hint});pv.hint=false;say(PQ[1]);
 var q=PQ;app.innerHTML=hud()+'<div class="stage"><div class="card">'+'<div class="kick">'+q[0]+'</div><div class="prompt">'+(ok?'<span class="pk">'+q[1]+'</span>':'<s style="color:var(--mute)">'+(typed||'…')+'</s><br><span class="pk">'+q[1]+'</span>')+'</div>'+tipBox({answer:q[1],why:q[1]+' = '+q[0],trick:G.provaTrick(q[1])},ok)+'<button class="btn p wide" data-a="pnext">Next</button></div></div>'}
function provaEnd(){var wrong=pv.log.filter(function(r){return !r.ok}).map(function(r){return r.i});var prevRight=PROVA.length-pv.q.length;var right=prevRight+pv.log.filter(function(r){return r.ok}).length;var pct=Math.round(100*right/PROVA.length);
 st.prova.tries++;st.prova.wrong=wrong;if(st.prova.best===null||pct>st.prova.best)st.prova.best=pct;st.prova.log.push({pct:pct,date:new Date().toISOString().slice(0,10)});save();
 var code=(right*7+st.prova.tries*3+13).toString(36).toUpperCase()+'-'+Math.abs(hashStr(JSON.stringify(st.prova.log))%46656).toString(36).toUpperCase();
 app.innerHTML=hud()+'<div class="stage"><div class="card center"><div class="shot"><b>FAI UNO SCREENSHOT DEL TUO VOTO</b><br>Then upload it to your Google Classroom page.<br><small>Chromebook: Ctrl + Show windows · iPhone: side button + volume up</small></div>'+
 '<div class="scorecard"><div class="k">'+G.title+' · '+(G.provaShort||'La Prova')+'</div><div class="big">'+pct+'%</div><div>'+right+' / '+PROVA.length+' '+(G.provaUnit||'sentences')+' · attempt '+st.prova.tries+' of 4</div><div class="k">Best: '+st.prova.best+'% · code '+code+'</div></div>'+
 (wrong.length&&st.prova.tries<4?'<div class="sub">Next try brings back only the '+wrong.length+' you missed. Best score counts.</div>':'')+
 '<div class="row" style="width:100%">'+(wrong.length&&st.prova.tries<4?'<button class="btn p" data-a="prova">Try again ›</button>':'')+'<button class="btn g" data-a="home">Home</button></div></div></div>'}
function hashStr(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h}

/* ---------- scene: watch + dub ---------- */
function scLines(it){return SCENE.lines}
function rScena(it){var L=scLines(it),sc=run.sc||(run.sc={i:-1,seen:{},playing:false,role:null,rec:null,stage:'pick'});
 var dub=it.mode==='dub';var h='<div class="card" style="padding:12px">';
 if(dub&&sc.stage==='pick'){h+='<div class="kick">Il doppiaggio · The dub</div>'+profBox(IMG.mic,'Scegli chi vuoi essere. Poi parla tu.','Pick your Boh. The other one keeps talking; you say the highlighted lines out loud.')+
  '<div class="rolepick"><button data-a="role" data-r="a" class="'+(sc.role==='a'?'on':'')+'"><span class="av"><img src="'+IMG.bohf+'" alt=""></span>'+SCENE.who.a+'<span class="sub" style="font-size:15px">'+SCENE.roleSub.a+'</span></button><button data-a="role" data-r="b" class="'+(sc.role==='b'?'on':'')+'"><span class="av"><img src="'+IMG.bohm+'" alt=""></span>'+SCENE.who.b+'<span class="sub" style="font-size:15px">'+SCENE.roleSub.b+'</span></button></div>'+
  '<button class="btn p wide" data-a="dubgo" '+(sc.role?'':'disabled')+'>Registra e via! · Record and go</button><div class="sub">When it ends you hear yourself back. Redo as many times as you like. Then save it for Classroom.</div></div>';return h}
 h+='<div class="phone"><div class="ph-top"><span><b>'+SCENE.title+'</b> · '+(dub?'tu sei '+SCENE.who[sc.role]:'guarda e ascolta')+'</span><span>'+(sc.i+1>0?Math.min(sc.i+1,L.length):0)+' / '+L.length+'</span></div>';
 h+='<div class="sc-stage"><div class="sc-avs"><div><div class="sc-av '+(L[sc.i]&&L[sc.i][0]==='a'?'on':'')+(dub&&sc.role==='a'?' me':'')+'"><img src="'+IMG.bohf+'" alt=""></div><div class="nm">'+SCENE.who.a+(dub&&sc.role==='a'?' · tu':'')+'</div></div><div><div class="sc-av '+(L[sc.i]&&L[sc.i][0]==='b'?'on':'')+(dub&&sc.role==='b'?' me':'')+'"><img src="'+IMG.bohm+'" alt=""></div><div class="nm">'+SCENE.who.b+(dub&&sc.role==='b'?' · tu':'')+'</div></div></div><div class="sc-lines" id="sclines">';
 L.forEach(function(l,i){var mine=dub&&l[0]===sc.role;var cls='sc-l '+l[0]+(sc.seen[i]?' seen':'')+(i===sc.i?' now':'')+(mine?' mine':'');h+='<div class="'+cls+'" data-a="scline" data-i="'+i+'">'+l[1]+(sc.en===i||(!dub&&sc.seen[i]&&sc.showEn)?'<small>'+l[2]+'</small>':'')+'</div>'});
 h+='</div></div>';
 h+='<div class="sc-ctl">';
 if(!dub){h+=(sc.playing?'<span class="btn g"><span class="mic"></span>In onda…</span>':'<button class="btn p" data-a="scplay">'+SPK+' '+(sc.done?'Guarda ancora':'Play')+'</button>')+'<button class="btn g" data-a="scen">'+(sc.showEn?'Hide English':'English')+'</button>'}
 else{if(sc.stage==='rec')h+='<span class="btn g" style="flex:2"><span class="mic"></span>Stai registrando… parla quando la riga è rosa</span>';
  else if(sc.stage==='review')h+='<audio controls src="'+sc.url+'" style="width:100%;flex-basis:100%"></audio><button class="btn g" data-a="dubagain">Rifai · Redo</button><button class="btn p" data-a="dubsave">'+(sc.saved?'Salvato ✓ · Save again':'Salva · Save')+'</button>'
  else if(sc.stage==='nomic')h+='<div class="sub" style="color:#fff;flex-basis:100%">Microphone not available here. Record on your phone with Vocaroo or the voice memo app and send it in Classroom.</div><a class="btn g" href="https://vocaroo.com" target="_blank" rel="noopener">Vocaroo ↗</a><button class="btn g" data-a="dubskip">I recorded another way</button>'}
 h+='</div></div>';
 if(dub&&sc.stage==='review')h+='<div class="sub" style="margin-top:6px">If Save does nothing on this device, record with Vocaroo instead and paste the link in Classroom.</div><button class="btn p wide" data-a="dubdone" style="margin-top:6px">Fatto · Done</button>';
 if(!dub&&sc.done)h+='<button class="btn p wide" data-a="next" style="margin-top:8px">Next</button>';
 return h+'</div>'}
function scPlay(mode){var it=run.items[run.i],L=scLines(it),sc=run.sc;sc.playing=true;sc.i=-1;card();
 var k=0;function step(){if(!run||run.sc!==sc||k>=L.length){if(run&&run.sc===sc){sc.playing=false;sc.i=-1;sc.done=true;if(mode==='dub')dubStop();card()}return}
  sc.i=k;sc.seen[k]=1;card();var l=L[k];var mine=mode==='dub'&&l[0]===sc.role;var p=mine?silentWait(l[1],clipFor(l[1],l[0]==='b'?'n':'s')):sayWait(l[1],l[0]==='b'?'n':'s');
  p.then(function(){k++;setTimeout(step,250)})}
 step()}
function dubStart(){var sc=run.sc;if(!navigator.mediaDevices||!window.MediaRecorder){sc.stage='nomic';return card()}
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){var mr;try{mr=new MediaRecorder(stream)}catch(e){sc.stage='nomic';return card()}var chunks=[];mr.ondataavailable=function(ev){if(ev.data.size)chunks.push(ev.data)};
  mr.onstop=function(){try{stream.getTracks().forEach(function(t){t.stop()})}catch(e){}var blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});sc.blob=blob;if(sc.url)URL.revokeObjectURL(sc.url);sc.url=URL.createObjectURL(blob);sc.stage='review';card()};
  sc.rec=mr;sc.stage='rec';mr.start();scPlay('dub')}).catch(function(){sc.stage='nomic';card()})}
function dubStop(){var sc=run.sc;try{if(sc.rec&&sc.rec.state!=='inactive')sc.rec.stop()}catch(e){sc.stage='review';card()}}
/* ---------- vero o falso ---------- */
function rVf(it){var v=run.vf||(run.vf={i:0,right:0,deck:shuffle(VF).slice(0,8),fb:null});
 if(v.i>=v.deck.length)return '<div class="card center"><div class="kick">Break · Vero o falso?</div>'+profBox(IMG.joy,'Finito! '+v.right+' su '+v.deck.length+'.','Break over. Back to the drama.')+'<button class="btn p wide" data-a="next">Next</button></div>';
 var w=v.deck[v.i];var h='<div class="card" style="gap:8px"><div class="kick">Break · Vero o falso? · '+(v.i+1)+' / '+v.deck.length+'</div><div class="sub">Is this a real Italian word? Tap VERO or FALSO.</div><div class="vf-card"><div class="vf-word">'+w[0]+'</div>'+(v.fb?'<div class="sub" style="font-size:17px"><b>'+(v.fb.ok?'Esatto!':'Ops!')+'</b> '+w[2]+'</div>':'')+'</div>';
 if(v.fb)h+='<button class="btn p wide" data-a="vfnext">Next</button>';else h+='<div class="vf-btns"><button class="btn g" data-a="vf" data-v="1">VERO</button><button class="btn g" data-a="vf" data-v="0">FALSO</button></div>';
 return h+'</div>'}

/* ---------- events ---------- */
app.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a');var it=run&&run.items[run.i];
 var wasShelf=onShelf;if(a!=='gender')onShelf=false;
 if(a==='bank'){var bi=app.querySelector('#ans');if(bi){bi.value=b.getAttribute('data-w');bi.focus()}return}
 if(a==='home'){if(wasShelf){location.href='../../?levels=1';return}return home()}if(a==='gender'){st.gender=b.getAttribute('data-g');save();return home()}if(a==='start')return start(+b.getAttribute('data-k'));if(a==='startnext')return start(firstOpen());if(a==='go')return card();
 if(a==='prova')return provaStart();if(a==='psay'){var pq=G.resolve?G.resolve(PROVA[pv.q[pv.i]]):PROVA[pv.q[pv.i]];say(pq[0],pq[4]);return}if(a==='phint'){pv.hint=true;return provaCard()}if(a==='psubmit')return provaSubmit();if(a==='pnext'){pv.i++;return provaCard()}
 if(a==='acc'){var inp=app.querySelector('#ans');if(inp){inp.value+=b.getAttribute('data-c');inp.focus()}return}
 if(!it)return;
 if(a==='say'){say(b.getAttribute('data-s'));return}
 if(a==='scplay'){scPlay('watch');return}
 if(a==='scen'){run.sc.showEn=!run.sc.showEn;return card()}
 if(a==='scline'){var li=+b.getAttribute('data-i'),ln=scLines(it)[li];if(run.sc.playing)return;run.sc.en=run.sc.en===li?-1:li;run.sc.seen[li]=1;say(ln[1],ln[0]==='b'?'n':'s');return card()}
 if(a==='role'){run.sc.role=b.getAttribute('data-r');return card()}
 if(a==='dubgo'){dubStart();return}
 if(a==='dubagain'){run.sc.stage='pick';run.sc.i=-1;run.sc.seen={};return card()}
 if(a==='dubsave'){var sc=run.sc,fn=(G.recName||'doppiaggio')+'-'+(sc.role==='a'?'lei':'lui')+'.webm';
   var fallback=function(){try{var l=document.createElement('a');l.href=sc.url;l.download=fn;document.body.appendChild(l);l.click();l.remove();sc.saved=true;card()}catch(e){}};
   if(window.claude&&window.claude.use){window.claude.use('downloads').then(function(d){if(!d)return fallback();return d.save({filename:fn,data:sc.blob}).then(function(){sc.saved=true;card()}).catch(function(err){if(err&&err.code==='declined')return;fallback()})}).catch(fallback)}else fallback();return}
 if(a==='dubskip'||a==='dubdone'){run.right++;run.total++;return next()}
 if(a==='vf'){var v=run.vf,w=v.deck[v.i],ok=(+b.getAttribute('data-v'))===w[1];v.fb={ok:ok};if(ok){v.right++;run.right++}run.total++;say(w[0]);return card()}
 if(a==='vfnext'){run.vf.i++;run.vf.fb=null;return card()}
 if(a==='hear'){say(it.hear,it.voice);return}
 if(a==='flip'){var i=+b.getAttribute('data-i');run.flip=run.flip===i?-1:i;say(it.chat.lines[i][1]);return card()}
 if(a==='more'){run.page+=2;return card()}
 if(a==='next')return next();
 if(a==='pick'){if(run.revealed)return;run.picked=b.getAttribute('data-o');say(it.answer);answer(run.picked===it.answer);return card()}
 if(a==='tile'){run.built.push(+b.getAttribute('data-ix'));say(it.pool[+b.getAttribute('data-ix')]);return card()}
 if(a==='untile'){run.built=run.built.filter(function(x){return x!==+b.getAttribute('data-ix')});return card()}
 if(a==='help'){if(run.help<2)run.help++;return card()}
 if(a==='check'){if(it.t==='tiles'){var s=run.built.map(function(ix){return it.pool[ix]}).join(' ');answer(norm(s)===norm(it.answer||it.tiles.join(' ')));say(it.say||it.tiles.join(' '));return card()}
  if(it.t==='type'){var inp2=app.querySelector('#ans');run.typed=inp2?inp2.value:'';answer([it.answer].concat(it.alts||[]).some(function(x){return sentOk(run.typed,x)}));say(it.answer);return card()}}
});
app.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var t=e.target;if(t.id!=='ans')return;e.preventDefault();var b=app.querySelector('[data-a="check"],[data-a="psubmit"]');if(b)b.click()});
window.__pp=function(){return {run:run,st:st,PROVA:PROVA}};
home();
})();
