/* ---------- build the 8 practice items of one stop ---------- */
var KICK=['Riscaldamento','Scegli','Completa','Costruiscila','Premio · 3 di fila','Ascolta e scrivi','SFIDA','Ultima!'];
function mkSentenceItems(S){
 var C=S.c,items=[];LIM=[0,2,3,4,6,6][S.n];
 function opts3(p,pid,o){var wv=wrongVerb(p),sp=swapPrep(p,pid,o);var a=[sent(p,pid,o),swapVerb(p,pid,o,wv[0])];a.push(sp||swapVerb(p,pid,o,wv[1]));return a}
 /* 1 warm-up: 2 choices, English shown */
 (function(){var a=C.c1,o=a[2],ok=sent(a[0],a[1],o);var wv=wrongVerb(a[0]);
  items.push({t:'pick',n:1,en:sentEn(a[0],a[1]),ok:ok,opts:shuffle([ok,swapVerb(a[0],a[1],o,wv[0])]),why:PERS[a[0]].pr+' = '+PERS[a[0]].v+'.',say:ok,
   help:{en:'Match the person to the verb.',it:PERS[a[0]].pr+' → '+PERS[a[0]].v}})})();
 /* 2 pick: 3 choices, English shown */
 (function(){var a=C.c2,o=a[2],ok=sent(a[0],a[1],o);var pl=PL[a[1]];
  items.push({t:'pick',n:2,dove:o.dove,en:sentEn(a[0],a[1]),ok:ok,opts:shuffle(opts3(a[0],a[1],o)),
   why:PERS[a[0]].pr+' = '+PERS[a[0]].v+'. '+(pl.prep==='a'?'🎯 a':pl.prep==='in'?'🏊 in':'Set phrase: '+pl.ph)+'.',say:ok,
   help:{en:'Check the verb, then check a or in.',it:PERS[a[0]].v+' · '+pl.ph}})})();
 /* 3 pick, no English: fill the verb */
 (function(){var a=C.c3,p=a[0],pid=a[1],P=PERS[p],pl=PL[pid];var ok=P.v;var d=wrongVerb(p).slice(0,2);
  items.push({t:'pick',n:3,tense:1,prompt:P.pr+' <span class="pk">___</span> '+pl.ph+'.',ok:ok,opts:shuffle([ok].concat(d)),say:sent(p,pid,{}),
   help:{en:sentEn(p,pid),it:P.pr.toLowerCase()+' → '+ok.charAt(0)+'…'}})})();
 /* 4 build it from audio */
 (function(){var a=C.c4,o=a[2]||{},tx=sent(a[0],a[1],o),w=tx.replace(/[.?]$/,'').split(' ');var pl=PL[a[1]];
  var dis=[wrongVerb(a[0])[0],pl.prep==='a'?'in':'a'].filter(function(x){return x&&w.map(function(y){return y.toLowerCase()}).indexOf(x.toLowerCase())===-1});
  items.push({t:'build',n:4,tense:1,target:tx,words:w,bank:w.concat(dis.slice(0,2)),audio:tx,
   help:{en:sentEn(a[0],a[1]),it:w[0]+'…'}})})();
 /* 5 reward match */
 items.push({t:'match',n:5,pairs:C.c5,help:{en:'Match each person, or place, to its partner.',it:C.c5[0][0]+' → '+C.c5[0][1]}});
 /* 6 listen and type */
 (function(){var a=C.c6,o=a[2]||{},tx=sent(a[0],a[1],o);
  items.push({t:'type',n:6,tense:1,answer:tx,audio:tx,help:{en:sentEn(a[0],a[1]),it:tx.split(' ')[0]+'…'}})})();
 /* 7 challenge: whole sentence, last two words are the student's */
 (function(){var pre=C.c7.pre;if(pre==='RANDOM_VL')pre=rnd([['Voi','andate'],['Loro','vanno']]);if(pre==='RANDOM_ALL'){var q=rnd(['io','tu','lui','lei','noi','voi','loro']);pre=[PERS[q].pr,PERS[q].v]}
  items.push({t:'chal',n:7,tense:1,pre:pre,dis:C.c7.dis,help:{en:'Say who goes, then choose where YOU go.',it:pre.join(' ')+' …'}})})();
 /* 8 easy closer: a or in */
 (function(){var a=C.c8,P=PERS[a[0]],pl=PL[a[1]];var ok=pl.prep;
  items.push({t:'pick',n:8,tense:1,prompt:(a[0]==='io'?cap1(P.v):P.pr+' '+P.v)+' <span class="pk">___</span> '+pl.w+'.',ok:ok,opts:shuffle(['a','in']),say:sent(a[0],a[1],{np:a[0]==='io'}),
   help:{en:'A city is a bullseye. A big space or a room is a pool.',it:pl.prep==='a'?'🎯 a':'🏊 in'}})})();
 return items;
}

/* match */
function matchHtml(it){
 if(!run.m||run.mFor!==run.i){run.mFor=run.i;run.m={L:shuffle(it.pairs.map(function(p,i){return {i:i,t:p[0]}})),R:shuffle(it.pairs.map(function(p,i){return {i:i,t:p[1]}})),sel:null,done:{},err:0,streak:0,bad:null}}
 var m=run.m,h='<div class="kick" style="color:var(--pink)">Premio · 3 di fila</div><div class="prompt">Abbina.</div><div class="pips" aria-label="3 di fila">'+[0,1,2].map(function(i){return '<i class="'+(i<m.streak?'on':'')+'"></i>'}).join('')+'<span>3 di fila</span></div>';
 h+='<div class="mgrid"><div class="stage" style="gap:10px">'+m.L.map(function(x){var c='opt'+(m.done[x.i]?' ok':m.sel===x.i?' sel':'');return '<button class="'+c+'" data-a="mL" data-i="'+x.i+'" '+(m.done[x.i]?'disabled':'')+'>'+esc(x.t)+'</button>'}).join('')+'</div>'+
  '<div class="stage" style="gap:10px">'+m.R.map(function(x){var c='opt'+(m.done[x.i]?' ok':m.bad===x.i?' no':'');return '<button class="'+c+'" data-a="mR" data-i="'+x.i+'" '+(m.done[x.i]?'disabled':'')+'>'+esc(x.t)+'</button>'}).join('')+'</div></div>';
 if(run.revealed){h+='<div class="fb '+(run.ok?'ok':'no')+' pop"><img src="'+(run.ok?IMG.joy:IMG.cheeky)+'" alt=""><div><b>'+(run.ok?'3 di fila! '+okHead():badHead())+'</b></div></div><button class="btn p wide" data-a="next">Avanti</button>'}
 else h+=helpHtml(it);
 return h}

function record(ok){var it=run.items[run.i];run.revealed=true;run.ok=ok;run.res.push(ok);if(ok)run.right++;if(it.t==='match'&&ok)run.reward3=true}

/* ---------- events ---------- */
app.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a');
 if(a==='path')return path();
 if(a==='stop'){if(!unlocked(+b.getAttribute('data-n')))return;return teach(+b.getAttribute('data-n'))}
 if(a==='tnext')return tnext();
 if(a==='say')return say(b.getAttribute('data-s'));
 if(a==='parla')return parla();
 if(a==='again')return startPractice(+b.getAttribute('data-n'));
 if(a==='nextstop'){var n=+b.getAttribute('data-n');return n<=5&&unlocked(n)?teach(n):path()}
 if(a==='dopractice')return startPractice(+b.getAttribute('data-n'));
 if(a.indexOf('t_')===0)return;
 if(!run||run.mode!=='practice')return parlaClick(b,a);
 var it=run.items[run.i];
 if(a==='help'){run.help=1;return card()}
 if(a==='hear'){return say(it.audio||it.answer)}
 if(a==='next'){run.i++;run.revealed=false;run.help=0;run.picked=null;run.typed='';run.sel=[];return card()}
 if(a==='pick'&&!run.revealed){var o=it.opts[+b.getAttribute('data-o')];run.picked=o;record(o===it.ok);if(it.say)say(it.say);return card()}
 if(a==='chip'&&!run.revealed){run.sel.push(+b.getAttribute('data-c'));return card()}
 if(a==='unchip'&&!run.revealed){var id=+b.getAttribute('data-c');run.sel=run.sel.filter(function(x){return x!==id});return card()}
 if(a==='bclear'){run.sel=[];return card()}
 if(a==='bcheck'){var got=run.sel.map(function(id){return run.bank[id].t}).join(' ');record(norm(got)===norm(it.target));if(it.audio)say(it.audio);return card()}
 if(a==='ccheck'){var toks=run.sel.map(function(id){return run.bank[id].t}),k=it.pre.length;
   var preOk=toks.length>=k+1&&it.pre.every(function(w,i){return toks[i].toLowerCase()===w.toLowerCase()});
   var end=toks.slice(k).join(' ').toLowerCase();var endOk=ENDINGS.indexOf(end)!==-1&&end.split(' ').length>=2;
   run.chalShow=toks.join(' ')+'.';var ok=preOk&&endOk;
   if(!ok)run.chalShow=it.pre.join(' ')+' '+(endOk?'…':'a / in + il posto')+' (🎯 a · 🏊 in)';
   record(ok);return card()}
 if(a==='tcheck'){var inp=app.querySelector('#ans');run.typed=inp?inp.value:'';record(norm(run.typed)===norm(it.answer));say(it.answer);return card()}
 if(a==='mL'&&!run.revealed){run.m.sel=+b.getAttribute('data-i');run.m.bad=null;return card()}
 if(a==='mR'&&!run.revealed){var m=run.m;if(m.sel===null)return;var ri=+b.getAttribute('data-i');
   if(ri===m.sel){m.done[ri]=1;m.streak++;m.sel=null;m.bad=null;if(Object.keys(m.done).length===it.pairs.length){record(m.err===0)}}
   else{m.err++;m.streak=0;m.bad=ri;m.sel=null}
   return card()}
});
app.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();var b=app.querySelector('[data-a="tcheck"]');if(b)b.click();return}
 if(view==='teach'&&run&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){var sc=document.getElementById('tsc');if(!sc)return;var p=run.page+(e.key==='ArrowRight'?1:-1);p=Math.max(0,Math.min(2,p));sc.scrollTo({left:p*(sc.clientWidth+12),behavior:'smooth'})}
});

/* ---------- Results (same buttons as every other level) ---------- */
function results(n){view='results';var S=STOPS[n-1];var right=run.right,first=!(st.stops[n]&&st.stops[n].done);
 var bc=0;if(first){bc=right*BC.perRight+BC.clear+(run.reward3?BC.reward:0)}
 var prev=st.stops[n]||{};st.stops[n]={done:true,best:Math.max(prev.best||0,right),paid:true};save();if(bc>0)award(bc);
 var nextN=n<5?n+1:0;var line=right===8?'Oooo! Bravissim'+bohEnd()+'!':right>=6?'Ottimo!':right>=4?'Bene!':'Ancora un giro!';
 app.innerHTML=topbar(BACKPATH)+'<div class="stage"><div class="card center pop">'+profBox(right>=6?IMG.joy:IMG.think,line,'')+
  '<div class="big">'+right+' / 8</div><div class="sub">Stop '+n+' · '+S.title+' · '+S.sub+'</div>'+
  '<div class="bcline">'+(bc>0?'+'+bc+' Boh Cashi':'Practice run · no new Boh Cashi')+'</div><div class="sub">'+(bc>0?'They land in your wallet the next time you open Italiano 2.':'Boh Cashi pay once per stop.')+'</div>'+
  '<div class="shot"><b>FAI UNO SCREENSHOT DEL TUO LAVORO</b>Then upload it to your Google Classroom page.<br>Chromebook: Ctrl + Show windows · iPhone: side button + volume up</div>'+
  '<div class="row" style="width:100%"><button class="btn p" data-a="nextstop" data-n="'+nextN+'">Avanti</button><a class="btn g" href="../../italiano2/?go=shop">Boh-tique</a></div>'+
  '<div class="row" style="width:100%"><button class="btn g" data-a="again" data-n="'+n+'">Try again</button><a class="btn g" href="../../italiano2/">Save &amp; quit</a></div>'+
  '<button class="btn q wide" data-a="parla">Vuoi parlare? <span style="font-size:17px;color:var(--mute);font-family:var(--body)">Do you want to speak?</span></button></div></div>'}

/* ---------- Parla: optional. Never blocks a stop. ---------- */
var TIERS=[
 {k:'ripeti',name:'Ripeti',en:'Repeat',bc:BC.parla.ripeti,lines:[['Vado a Roma.','I go to Rome.'],['Vado in Italia.','I go to Italy.'],['Vai a scuola.','You go to school.']],ask:'Listen, then say each line out loud.'},
 {k:'rispondi',name:'Rispondi',en:'Answer',bc:BC.parla.rispondi,lines:[['Dove vai?','Where are you going?'],['Tu vai a casa?','Are you going home?']],ask:'Answer each question out loud in Italian. Use vado… or vai…'},
 {k:'giorno',name:'Il tuo giorno',en:'Your day',bc:BC.parla.giorno,lines:[],ask:'Say 3 places you go in your day. Start each one with Vado…'}
];
function parla(){view='parla';run=null;
 var h=topbar(BACKPATH)+'<div class="stage"><div class="card">'+profBox(IMG.mic,'Vuoi parlare?','Do you want to speak?')+
  '<div class="sub">Totally optional. You can skip all of it and nothing is lost: no penalty, no blocked stops. Each tier you finish earns extra Boh Cashi.</div>';
 TIERS.forEach(function(T){var d=st.parla[T.k];
  h+='<div class="tier'+(d?' done':'')+'" data-tier="'+T.k+'"><h2><span>'+T.name+' <small style="font-size:17px;color:var(--mute);font-family:var(--body)">'+T.en+'</small></span><span class="bc">'+(d?'✓ done':'+'+T.bc+' BC')+'</span></h2><div class="sub">'+T.ask+'</div>';
  if(T.lines.length)h+=T.lines.map(function(l){return '<div class="say-line"><span>'+l[0]+'<small>'+l[1]+'</small></span>'+(hasClip(l[0])?'<button data-a="say" data-s="'+esc(l[0])+'" aria-label="Hear '+esc(l[0])+'">'+SPK+'</button>':'')+'</div>'}).join('');
  else h+='<div class="say-line"><span>a casa · a scuola · in bagno · in palestra<small>a Roma · in Italia · dal dottore · a prendere acqua</small></span></div>';
  h+='<div class="recwrap" id="rec_'+T.k+'"></div><div id="alt_'+T.k+'"></div>'+
   (d?'':'<div class="row"><button class="btn g" data-a="vocaroo" data-k="'+T.k+'">Mic not working? Vocaroo</button><button class="btn g" data-a="cant" data-k="'+T.k+'">I can’t do it here</button></div>')+'</div>'});
 h+='<div id="handin"></div><button class="btn p wide" data-a="path">Avanti</button></div></div>';
 app.innerHTML=h;
 TIERS.forEach(function(T){var el=document.getElementById('rec_'+T.k);if(!el||st.parla[T.k])return;
  try{if(window.BohRecorder)window.BohRecorder.mount(el,{key:'andare3_'+T.k,label:T.name,maxSec:60,name:'',onChange:function(has){if(has)markTier(T.k,'mic')},onEscalate:function(){vocaroo(T.k)}});else vocaroo(T.k)}catch(err){vocaroo(T.k)}});
 handIn()}
function handIn(){var el=document.getElementById('handin');var n=Object.keys(st.parla).length;if(!el||!n)return;try{if(window.BohRecorder&&window.BohRecorder.handIn)window.BohRecorder.handIn(el,{unit:'Andare · Chi va?',n:n,dl:false})}catch(e){}}
function markTier(k,how){if(st.parla[k])return;var T=TIERS.filter(function(x){return x.k===k})[0];st.parla[k]={how:how,ts:new Date().toISOString().slice(0,10)};save();award(T.bc);if(view==='parla')parla()}
function vocaroo(k){var box=document.getElementById('alt_'+k);if(!box||box.firstChild)return;
 box.innerHTML='<div class="helpbox"><b>No microphone here? Use Vocaroo.</b><ol class="steps"><li><a href="https://vocaroo.com" target="_blank" rel="noopener">Open Vocaroo</a></li><li>Record yourself, then copy the link.</li><li>Paste the link into Google Classroom.</li></ol><button class="btn p wide" data-a="tdone" data-k="'+k+'" data-how="vocaroo">Ho fatto · I did it</button></div>'}
function cant(k){var box=document.getElementById('alt_'+k);if(!box)return;
 box.innerHTML='<div class="helpbox"><b>I can’t do it here.</b> Record on your own device (phone or computer), then add the file to Google Classroom or email it to your teacher.<button class="btn p wide" style="margin-top:8px" data-a="tdone" data-k="'+k+'" data-how="other">Ho fatto · I did it</button></div>'}
function parlaClick(b,a){
 if(a==='vocaroo')return vocaroo(b.getAttribute('data-k'));
 if(a==='cant')return cant(b.getAttribute('data-k'));
 if(a==='tdone')return markTier(b.getAttribute('data-k'),b.getAttribute('data-how'))}

window.__andare3=function(){return {run:run,st:st,view:view,STOPS:STOPS}};
path();
})();
</script>
