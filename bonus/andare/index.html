<style>

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.35;font-weight:700}

.top{display:flex;align-items:center;gap:10px;min-height:48px}

.hud{display:flex;gap:8px;align-items:center;font-family:var(--display);font-size:17px}

.crumb{font-size:16px;color:var(--mute);font-weight:800;margin:6px 2px 4px;display:flex;justify-content:space-between;gap:10px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 2px 8px}
.bar i{display:block;height:100%;background:var(--turq);width:0;transition:width .3s}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:auto}

h1{font-size:30px}h2{font-size:24px}
.prompt{font-family:var(--display);font-size:28px;font-weight:600}
.pk{color:var(--pink)}
.sub{color:var(--mute);font-size:17px}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:10px 14px;font-size:20px;font-weight:800;text-align:left;transition:transform .08s}

.prof{display:flex;gap:12px;align-items:flex-end}

.btn.p{background:var(--blue);color:var(--blue-fg)}
.btn.g{background:var(--card);border:2px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.tricks{background:var(--turq-soft);border-radius:16px;padding:12px 14px;font-size:17px}
.tricks div{display:flex;gap:10px;margin:4px 0}
.tricks span.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--card);font-size:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
input.ans{font:inherit;font-size:22px;font-weight:800;width:100%;min-height:58px;border-radius:16px;border:2px solid var(--line);padding:10px 14px;background:var(--card);color:var(--fg)}
.acc{display:flex;gap:6px;flex-wrap:wrap}

.big{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;color:var(--blue)}
.center{text-align:center;align-items:center}
.shot{background:var(--pink-soft);border-radius:16px;padding:12px 14px;font-size:17px}

.scorecard ul{margin:4px 0;padding-left:20px;font-size:18px}
.streak{color:var(--gold)}
/* home */
.home{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:auto}
.hero{display:flex;gap:12px;align-items:center}
.hero img{width:110px;height:110px;border-radius:50%;object-fit:cover;object-position:top;background:var(--card);box-shadow:var(--shadow)}
.hero .t small{display:block;color:var(--mute);font-size:16px}
.shelf{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.shelf .kick{margin-bottom:6px}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stk .s{min-height:52px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);font-family:var(--display);font-weight:600;font-size:19px;color:var(--mute);text-align:center;padding:4px}
.stk .s.got{border-style:solid;border-color:var(--turq);background:var(--turq-soft);color:var(--fg)}
.stops{display:flex;flex-direction:column;gap:8px}
.stop{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;text-align:left;width:100%}
.stop .n{width:40px;height:40px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:19px;flex:none}
.stop.cur .n{background:var(--blue);color:var(--blue-fg)}
.stop.done .n{background:var(--turq);color:#fff}
.stop.lock{opacity:.5}
.stop .l{flex:1;font-size:19px;font-weight:800}.stop .l small{display:block;color:var(--mute);font-size:16px;font-weight:700}
.work{font-size:16px;color:var(--mute)}
/* mini lesson */
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}
.chunk{text-align:center}
.chunk .bg{font-family:var(--display);font-size:52px;font-weight:700}
.chunk .eq{font-size:22px;color:var(--mute)}
.pairs{display:flex;flex-direction:column;gap:8px}
.pair{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px 14px;font-size:20px}
.pair small{color:var(--mute);font-size:16px}
.artrow{display:flex;gap:14px;align-items:center;justify-content:center}
.artrow .word{font-family:var(--display);font-size:34px;font-weight:700}
.artrow .word small{display:block;font-size:16px;color:var(--mute);font-family:var(--body)}
.say{display:flex;flex-direction:column;gap:10px}
.sayb{background:var(--bg);border-radius:16px;padding:12px 14px;text-align:left;font-size:22px;min-height:60px}
.sayb span{display:block;color:var(--mute);font-size:16px;font-weight:700}

.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:96px;align-content:flex-start;border:2px dashed var(--line);border-radius:16px;padding:12px}
.slots .w{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:6px 14px;font-size:24px;font-family:var(--display);font-weight:600}.slots .w.pk{background:var(--pink-soft);border-color:var(--pink);color:var(--pink)}
.slots .ph{color:var(--mute);font-size:17px}
.msg{min-height:56px;border-radius:16px;background:var(--turq-soft);padding:10px 14px;font-size:18px}
.msg b{font-family:var(--display);font-size:22px;font-weight:600;margin-right:6px}
.msg.bad{background:var(--pink-soft)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices .opt{flex:1;min-width:30%;text-align:center;min-height:52px}
.stickerpop{font-family:var(--display);font-size:38px;color:var(--fg);font-weight:700;border:3px solid var(--turq);background:var(--turq-soft);border-radius:24px;padding:14px 26px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-height:700px){.prompt{font-size:24px}.opt{min-height:50px;font-size:18px}.prof img{width:72px;height:72px}body{font-size:17px}.slots{min-height:80px}}
</style>

var PL = {
  casa:       { it: 'casa',        en: 'home',            prep: 'a',  t3: 'Bullseye: home is a point. a casa.',            t4: 'Casa = home.' },

};
var PLACE_IDS = ['casa', 'scuola', 'Roma', 'bagno', 'biblioteca', 'palestra', 'mensa', 'infermeria', 'Italia'];

var MODAL = {

  Devo:   { en: 'I have to', q: false },

};

/* English for builder prompts */
function enFor(modal, pid) {
  if (pid === 'acqua') return 'Can I go get water?';
  var dest = pid === 'casa' ? 'home' : 'to ' + PL[pid].en;
  if (modal === 'Posso') return 'Can I go ' + dest + '?';
  return MODAL[modal].en + ' go ' + dest + '.';

function sentFor(modal, pid) {
  var p = PL[pid];
  return modal + ' andare ' + p.prep + ' ' + p.it + (modal === 'Posso' ? '?' : '.');
}

/* Prof Lo So reactions. No English under them (teacher's rule). */
var R_OK = ['Bene!', 'Ottimo!', 'Eccellente!', 'Ue!'];

var R_PART = 'E!!';
var R_HELP = 'E dai!';

var L1 = {

    { kind: 'say', prof: 'Ascolta. Ripeti.', tip: 'Tap each line.',

    { kind: 'try', prof: 'Capisci?', tip: 'Pick the one that works.',

};
var L2 = {

};

/* stop 1/2 questions (mc) */
var S1_MC = [
  { q: 'I want to go', opts: ['Voglio vado', 'Voglio andare', 'Voglio vai'], ok: 'Voglio andare', why: 'After voglio, use andare.', say: 'Voglio andare.' },
  { q: 'Can you go?', opts: ['Puoi andare?', 'Puoi vai?', 'Puoi vado?'], ok: 'Puoi andare?', why: 'After puoi, use andare.', say: 'Puoi andare?' },
  { q: 'I have to go', opts: ['Devo vado', 'Devo andare', 'Devo vai'], ok: 'Devo andare', why: 'After devo, use andare.', say: 'Devo andare.' },
  { hear: 'Devi andare?', q: 'Listen and tap what you hear.', opts: ['Devi andare?', 'Vuoi andare?', 'Puoi andare?'], ok: 'Devi andare?', why: 'You heard: devi andare = you have to go.' }
];
var S2_MC = [
  ['Italia', 'in'], ['Roma', 'a'], ['scuola', 'a'], ['mensa', 'in'], ['casa', 'a'], ['palestra', 'in'], ['infermeria', 'in']
];

/* stop 4: listen and type, then two quick wins from earlier levels */
var S4_TYPE = [
  { s: 'Vuoi andare a scuola?', en: 'Do you want to go to school?' },
  { s: 'Devi andare in palestra.', en: 'You have to go to the gym.' },

  ['I want to go home.', 'Voglio andare a casa.', ['Io voglio andare a casa.']],

];
var BANK = ['voglio', 'vuoi', 'devo', 'devi', 'posso', 'puoi', 'andare', 'a', 'in', 'ho fame', 'casa', 'scuola', 'Roma', 'bagno', 'biblioteca', 'palestra', 'mensa', 'infermeria', 'Italia', "prendere l'acqua"];

var IDIOM = { it: 'Tutte le strade portano a Roma', en: 'All roads lead to Rome.', ex: 'Tutte le strade portano a Roma. Voglio andare a Roma!', exEn: 'All roads lead to Rome. I want to go to Rome!', note: 'Said when different paths reach the same result.' };

/* words that must never be fuzzy-matched when checking typed answers */
var GRAMMAR = ['voglio', 'vuoi', 'devo', 'devi', 'posso', 'puoi', 'andare', 'vado', 'vai', 'a', 'in', 'ho', 'hai', 'sei', 'sono'];

/* every Italian phrase the game can speak (for Sara clips) */
function allPhrases() {
  var out = [];
  var add = function (t) { if (t) out.push(String(t).replace(/<[^>]+>/g, '').replace(/___/g, '').trim()); };
  [L1, L2].forEach(function (L) { L.cards.forEach(function (c) {

    if (c.pairs) c.pairs.forEach(function (p) { add(p[0].replace(/<[^>]+>/g, '')); });

  }); });

  S4_TYPE.forEach(function (x) { add(x.s); });
  S4_QUICK.forEach(function (x) { add(x.say); });
  PROVA.forEach(function (p) { add(p[1]); });
  ['Voglio', 'Devo', 'Posso'].forEach(function (m) { Object.keys(PL).forEach(function (pid) { add(sentFor(m, pid)); add(m); }); });
  ['andare', 'vado', 'vai', 'a', 'in'].forEach(add);
  Object.keys(PL).forEach(function (pid) { add(PL[pid].it); add(PL[pid].prep + ' ' + PL[pid].it); });
  add(IDIOM.it); add(IDIOM.ex);
  add('Posso riempire la bottiglia?'); add('Ciao! Hai fame? Dove vuoi andare?');
  ['Pronti?', 'Ascolta.', 'Ripeti.', 'Capisci?', 'Andiamo!', 'Bene!', 'Ottimo!', 'Eccellente!'].forEach(add);
  return out;
}

function bSteps(it){

   var sentence=sentFor(it.modal,it.pid);b.fin=sentence.replace(' '+PL[it.pid].prep+' ',' <span class="pk"><u>'+PL[it.pid].prep+'</u></span> ');
   b.head=okHead()+' ';
   if(st.sent.indexOf(sentence)===-1){st.sent.push(sentence);if(st.sent.length>12)st.sent.shift()}
   if(it.pid!=='acqua'&&st.stickers.indexOf(it.pid)===-1){st.stickers.push(it.pid);b.newSticker=true}
   save();setTimeout(function(){say(sentence)},300)}
  else b.msg='<b>'+R_PART+'</b>'}
 else{b.miss++;b.show=s.ok;b.bad=true;run.streak=0;
  b.msg='<b>'+(b.miss>=2?R_HELP:badHead())+'</b> '+s.tip+' It is <span class="pk">'+s.ok+'</span>.';
  if(!b.counted){b.counted=true;run.total++;run.hearts=Math.max(0,run.hearts-1);if(run.hearts===0){run.hearts=3;run.refill=true}}}
 card()}

/* ---------- listen and type ---------- */
function rType(it){var h='<div class="card"><div class="kick">Listen and type · Ascolta e scrivi</div><button class="hear" data-a="hear">'+SPK+' Ascolta · tap to hear again</button>';
 if(run.help>=1)h+='<div class="sub">English: '+it.en+'</div>';if(run.help>=2)h+='<div class="sub">Starts with: <b>'+it.answer.split(' ').slice(0,2).join(' ')+'…</b></div>';
 if(!run.revealed){h+='<input class="ans" id="ans" autocomplete="off" autocapitalize="sentences" placeholder="Scrivi quello che senti…" aria-label="Type what you hear">';
  h+='<div class="acc">'+['à','è','é','ì','ò','ù'].map(function(c){return '<button data-a="acc" data-c="'+c+'">'+c+'</button>'}).join('')+'</div>';
  h+='<div class="row"><button class="btn g" data-a="help">'+((run.help||0)===0?'Help · Aiuto':(run.help===1?'More help':'No more help'))+'</button><button class="btn p" data-a="check">Check</button></div>'}
 else h+='<div class="prompt">'+(run.ok?'<span class="pk">'+it.answer+'</span>':'<s style="color:var(--mute)">'+esc(run.typed)+'</s><br><span class="pk">'+it.answer+'</span>')+'</div>'+tipBox(run.ok,run.ok?okHead():badHead(),it.answer,it.answer+' = '+it.en)+'<button class="btn p wide" data-a="next">Avanti</button>';
 return h+'</div>'}

/* ---------- checking: forgive typos, not grammar ---------- */
function norm(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[?.!,;:]/g,'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim()}
function ed(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++){var c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function wordOk(got,want){if(got===want)return true;if(GRAMMAR.indexOf(want)!==-1||GRAMMAR.indexOf(got)!==-1)return false;return want.length>=4&&ed(got,want)<=1}
function sentOk(typed,answer){var a=norm(typed).split(' '),b=norm(answer).split(' ');if(a.length!==b.length)return false;for(var i=0;i<a.length;i++)if(!wordOk(a[i],b[i]))return false;return true}

/* ---------- flow ---------- */
function answer(ok){run.total++;run.revealed=true;run.ok=ok;if(ok){run.right++;run.streak++;if(run.streak>st.streakBest){st.streakBest=run.streak;save()}}else{run.streak=0;run.hearts=Math.max(0,run.hearts-1);var it=run.items[run.i];if(!it.again&&it.t!=='lesson'){var again=JSON.parse(JSON.stringify(it));again.again=true;again.kick='Ancora una volta · '+(it.kick||'');if(again.opts)again.opts=shuffle(again.opts);run.items.splice(Math.min(run.i+3,run.items.length),0,again)}}
 if(run.hearts===0){run.hearts=3;run.refill=true}}
function next(){run.i++;run.revealed=false;run.help=0;run.page=0;run.picked=null;run.typed='';run.b=null;
 if(run.refill){run.refill=false;app.innerHTML=hud()+'<div class="stage"><div class="card center">'+profBox(IMG.think,'Ma no! Un cuore nuovo.','')+'<div class="tricks"><div><span class="n">1</span><span>After voglio, devo, posso: andare.</span></div><div><span class="n">2</span><span>A is the bullseye: a casa, a scuola, a Roma.</span></div><div><span class="n">3</span><span>IN is the pool: in mensa, in palestra, in Italia.</span></div></div><button class="btn p wide" data-a="go">Andiamo!</button></div></div>';return}
 card()}
function stopDone(){var k=run.k;if(st.done.indexOf(k)===-1)st.done.push(k);save();
 var pct=run.total?Math.round(100*run.right/run.total):100;
 var last=st.done.length>=4;
 app.innerHTML=hud()+'<div class="stage"><div class="card center pop">'+profBox(IMG.joy,'Oooo! '+bravo(),'')+'<div class="big">'+pct+'%</div><div class="sub">'+run.right+' of '+run.total+' right · best streak '+st.streakBest+' di fila</div><div class="sub">'+st.stickers.length+' of 9 place stickers</div>'+
 '<div class="row" style="width:100%"><button class="btn p" data-a="'+(last?'prova':'startnext')+'">'+(last?'La Prova ›':'Avanti ›')+'</button><button class="btn g" data-a="home">Home</button></div></div></div>'}

/* ---------- La Prova ---------- */
var pv=null;
function provaStart(){if(st.prova.tries>=4){home();return}var idx=st.prova.wrong&&st.prova.wrong.length?st.prova.wrong:[0,1,2,3,4,5];pv={q:idx.slice(),i:0,log:[]};provaCard()}
function provaCard(){var qi=pv.q[pv.i];if(qi===undefined)return provaEnd();var q=PROVA[qi];run=null;
 app.innerHTML=hud()+'<div class="crumb"><span>La Prova · Attempt '+(st.prova.tries+1)+' of 4</span><span>'+(pv.i+1)+' / '+pv.q.length+'</span></div><div class="bar"><i style="width:'+Math.round(100*pv.i/pv.q.length)+'%"></i></div><div class="stage"><div class="card"><div class="kick">Write the whole sentence in Italian</div><div class="prompt">'+q[0]+'</div>'+
 '<input class="ans" id="ans" autocomplete="off" placeholder="In italiano…" aria-label="Write it in Italian"><div class="acc">'+['à','è','é','ì','ò','ù'].map(function(c){return '<button data-a="acc" data-c="'+c+'">'+c+'</button>'}).join('')+'</div>'+
 '<div class="kick">Word bank · banca delle parole</div><div class="bank">'+shuffle(BANK).map(function(w){return '<span>'+w+'</span>'}).join('')+'</div>'+
 '<div class="row">'+(pv.hint?'<div class="sub" style="flex:1">Hint: starts with <b>'+q[1].split(' ')[0]+'</b></div>':'<button class="btn g" data-a="phint">Hint</button>')+'<button class="btn p" data-a="psubmit">Check</button></div></div></div>';
 app.querySelector('#ans').focus()}
function provaSubmit(){var inp=app.querySelector('#ans');var typed=inp?inp.value:'';var qi=pv.q[pv.i];var q=PROVA[qi];var ok=[q[1]].concat(q[2]||[]).some(function(x){return sentOk(typed,x)});pv.log.push({i:qi,typed:typed,ok:ok});pv.hint=false;say(q[1]);
 run={okN:0,badN:0};
 app.innerHTML=hud()+'<div class="stage"><div class="card"><div class="kick">'+q[0]+'</div><div class="prompt">'+(ok?'<span class="pk">'+q[1]+'</span>':'<s style="color:var(--mute)">'+esc(typed||'…')+'</s><br><span class="pk">'+q[1]+'</span>')+'</div>'+tipBox(ok,ok?okHead():badHead(),q[1],q[1]+' = '+q[0])+'<button class="btn p wide" data-a="pnext">Avanti</button></div></div>';run=null}
function hashStr(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h}
function today(){var d=new Date();return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function provaEnd(){var wrong=pv.log.filter(function(r){return !r.ok}).map(function(r){return r.i});var prevRight=6-pv.q.length;var right=prevRight+pv.log.filter(function(r){return r.ok}).length;var pct=Math.round(100*right/6);
 st.prova.tries++;st.prova.wrong=wrong;if(st.prova.best===null||pct>st.prova.best)st.prova.best=pct;st.prova.log.push({pct:pct,date:new Date().toISOString().slice(0,10)});save();
 scoreScreen('prova',wrong.length&&st.prova.tries<4)}
function codeOf(){return ((st.prova.best||0)*7+st.prova.tries*3+13).toString(36).toUpperCase()+'-'+(Math.abs(hashStr(JSON.stringify(st.prova.log))%46656)).toString(36).toUpperCase()}
/* The Show Prof card: the student's proof of work. Screenshot and upload to Google Classroom. */
function scoreScreen(from,again){
 inShow=true;var last=st.sent.slice(-4);
 app.innerHTML=hud()+'<div class="stage"><div class="card center"><div class="shot"><b>FAI UNO SCREENSHOT DEL TUO LAVORO</b><br>Then upload it to your Google Classroom page.<br><small>Chromebook: Ctrl + Show windows · iPhone: side button + volume up</small></div>'+
 '<div class="scorecard"><div class="k">Dove vai? · Show Prof</div><div class="k">'+today()+'</div>'+
 (st.prova.best!==null?'<div class="big">'+st.prova.best+'%</div><div>La Prova best · attempt '+st.prova.tries+' of 4</div>':'<div>La Prova: not tried yet</div>')+
 '<div class="k">Sentences I built</div><ul>'+(last.length?last.map(function(s){return '<li>'+s+'</li>'}).join(''):'<li>None yet</li>')+'</ul>'+
 '<div class="k">Place stickers: '+st.stickers.length+' of 9</div><div>'+(st.stickers.length?st.stickers.map(function(p){return PL[p].it}).join(', '):'None yet')+'</div>'+
 (st.prova.tries?'<div class="k">Code '+codeOf()+'</div>':'')+'</div>'+
 (again?'<div class="sub">Next try brings back only the ones you missed. Best score counts.</div>':'')+
 (from==='prova'&&st.prova.best!==null&&st.prova.best>=50?'<div class="tricks"><b>'+IDIOM.it+'</b> · '+IDIOM.en+'<br>'+IDIOM.ex+'<br><span style="color:var(--mute)">'+IDIOM.note+'</span></div>':'')+
 '<div class="row" style="width:100%">'+(again?'<button class="btn p" data-a="prova">Try again ›</button>':'')+'<button class="btn g" data-a="home">Home</button></div></div></div>'}

/* ---------- events ---------- */
app.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a');var it=run&&run.items&&run.items[run.i];
 if(a==='home')return home();
 if(a==='gender'){st.gender=b.getAttribute('data-g');save();return home()}
 if(a==='start')return start(+b.getAttribute('data-k'));
 if(a==='startnext')return start(firstOpen());
 if(a==='go')return card();
 if(a==='prova')return provaStart();
 if(a==='showprof')return scoreScreen('home',false);
 if(a==='phint'){pv.hint=true;return provaCard()}
 if(a==='psubmit')return provaSubmit();
 if(a==='pnext'){pv.i++;return provaCard()}
 if(a==='acc'){var inp=app.querySelector('#ans');if(inp){inp.value+=b.getAttribute('data-c');inp.focus()}return}
 if(a==='say'){say(b.getAttribute('data-s'));return}
 if(!it)return;
 if(a==='hear'){say(it.hear);return}
 if(a==='next')return next();
 if(a==='lnext'){var L=it.L;if(run.page<L.cards.length-1){run.page++;run.revealed=false;run.picked=null;return card()}run.page=0;return next()}
 if(a==='lpick'){if(run.revealed)return;var c=it.L.cards[run.page];run.picked=b.getAttribute('data-o');say(c.ok);run.revealed=true;run.ok=run.picked===c.ok;return card()}
 if(a==='pick'){if(run.revealed)return;run.picked=b.getAttribute('data-o');say(it.say||it.answer);answer(run.picked===it.answer);return card()}
 if(a==='bpick'){return bPick(b.getAttribute('data-o'))}
 if(a==='bnext'){var done=run.b&&run.b.done;if(done)return next();return}
 if(a==='help'){if((run.help||0)<2)run.help=(run.help||0)+1;return card()}
 if(a==='check'&&it.t==='type'){var inp2=app.querySelector('#ans');run.typed=inp2?inp2.value:'';answer([it.answer].some(function(x){return sentOk(run.typed,x)}));say(it.answer);return card()}
});
app.addEventListener('keydown',function(e){if(e.key!=='Enter')return;if(e.target.id!=='ans')return;e.preventDefault();var b=app.querySelector('[data-a="check"],[data-a="psubmit"]');if(b)b.click()});
window.__andare=function(){return {run:run,st:st,pv:pv}};
home();
})();
</script>
