<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dove vai? 2 · Italiano 2 · BOH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#EAF4FB; --card:#FFFFFF; --fg:#17304A; --mute:#5B7185; --line:#CFE0EE;
  --blue:#1E63D6; --blue-fg:#FFFFFF; --turq:#17B3A6; --turq-soft:#DDF6F3;
  --pink:#E8338C; --pink-soft:#FDE4F0; --gold:#D79A1E; --gold-soft:#FFF1CC;
  --ok:#1E9E5A; --ok-soft:#DDF5E7; --heart:#F0497A;
  --display:'Fredoka','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,sans-serif;
  --r:22px; --shadow:0 6px 18px rgba(23,48,74,.08);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.35;font-weight:700}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;min-height:48px}
.top .back{white-space:nowrap;font-family:var(--display);font-weight:600;font-size:17px;padding:8px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.top .sp{flex:1}
.hud{display:flex;gap:8px;align-items:center;font-family:var(--display);font-size:17px}
.hud .pill{white-space:nowrap;font-size:16px;background:var(--card);border-radius:999px;padding:6px 10px;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.hearts i{display:inline-block;width:16px;height:16px;background:var(--heart);clip-path:path('M8 15 L1.5 8.5 A4 4 0 0 1 8 3.5 A4 4 0 0 1 14.5 8.5 Z');margin-right:2px;opacity:.25}
.hearts i.on{opacity:1}
.crumb{font-size:16px;color:var(--mute);font-weight:800;margin:6px 2px 4px;display:flex;justify-content:space-between;gap:10px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 2px 8px}
.bar i{display:block;height:100%;background:var(--turq);width:0;transition:width .3s}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:auto}
.kick{font-size:16px;color:var(--mute);letter-spacing:.02em;text-transform:uppercase;font-weight:800}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px}h2{font-size:24px}
.prompt{font-family:var(--display);font-size:28px;font-weight:600}
.pk{color:var(--pink)}
.sub{color:var(--mute);font-size:17px}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:10px 14px;font-size:20px;font-weight:800;text-align:left;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.no{background:var(--pink-soft);border-color:var(--pink);color:var(--pink)}
.opt.show{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.opt[disabled]{cursor:default}
.tip{border-radius:16px;background:var(--turq-soft);padding:12px 14px;font-size:17px;display:flex;gap:10px;align-items:flex-start}
.tip b{font-family:var(--display);font-weight:600;display:block;font-size:20px}
.tip img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:top;flex:none;background:var(--card)}
.tip.bad{background:var(--pink-soft)}
.prof{display:flex;gap:12px;align-items:flex-end}
.prof img{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:top;background:var(--turq-soft);flex:none}
.bubble{background:var(--turq-soft);border-radius:18px;padding:12px 14px;font-size:21px;font-family:var(--display);font-weight:600;flex:1}
.bubble small{display:block;color:var(--mute);font-size:16px;margin-top:3px;font-family:var(--body);font-weight:700}
.btn{font-family:var(--display);font-weight:600;font-size:21px;min-height:56px;border-radius:18px;padding:10px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--blue);color:var(--blue-fg)}
.btn.g{background:var(--card);border:2px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.tricks{background:var(--turq-soft);border-radius:16px;padding:12px 14px;font-size:17px}
.tricks div{display:flex;gap:10px;margin:4px 0}
.tricks span.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--card);font-size:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
input.ans{font:inherit;font-size:22px;font-weight:800;width:100%;min-height:58px;border-radius:16px;border:2px solid var(--line);padding:10px 14px;background:var(--card);color:var(--fg)}
.acc{display:flex;gap:6px;flex-wrap:wrap}
.acc button{min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--line);font-size:20px;font-weight:800}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.bank span{background:var(--bg);border-radius:10px;padding:4px 10px;font-size:16px}
.hear{width:100%;min-height:92px;border-radius:18px;background:var(--turq-soft);display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-size:22px;font-weight:600}
.hear svg{width:40px;height:40px}
.big{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;color:var(--blue)}
.center{text-align:center;align-items:center}
.shot{background:var(--pink-soft);border-radius:16px;padding:12px 14px;font-size:17px}
.scorecard{border:3px solid var(--blue);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--card);width:100%;text-align:left}
.scorecard .k{font-size:15px;color:var(--mute);text-transform:uppercase;letter-spacing:.02em}
.scorecard ul{margin:4px 0;padding-left:20px;font-size:18px}
.streak{color:var(--gold)}
/* home */
.home{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:auto}
.hero{display:flex;gap:12px;align-items:center}
.hero img{width:110px;height:110px;border-radius:50%;object-fit:cover;object-position:top;background:var(--card);box-shadow:var(--shadow)}
.hero .t small{display:block;color:var(--mute);font-size:16px}
.shelf{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.shelf .kick{margin-bottom:6px}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stk .s{min-height:52px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);font-family:var(--display);font-weight:600;font-size:19px;color:var(--mute);text-align:center;padding:4px}
.stk .s.got{border-style:solid;border-color:var(--turq);background:var(--turq-soft);color:var(--fg)}
.stops{display:flex;flex-direction:column;gap:8px}
.stop{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;text-align:left;width:100%}
.stop .n{width:40px;height:40px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:19px;flex:none}
.stop.cur .n{background:var(--blue);color:var(--blue-fg)}
.stop.done .n{background:var(--turq);color:#fff}
.stop.lock{opacity:.5}
.stop .l{flex:1;font-size:19px;font-weight:800}.stop .l small{display:block;color:var(--mute);font-size:16px;font-weight:700}
.work{font-size:16px;color:var(--mute)}
/* mini lesson */
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}
.chunk{text-align:center}
.chunk .bg{font-family:var(--display);font-size:52px;font-weight:700}
.chunk .eq{font-size:22px;color:var(--mute)}
.pairs{display:flex;flex-direction:column;gap:8px}
.pair{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px 14px;font-size:20px}
.pair small{color:var(--mute);font-size:16px}
.artrow{display:flex;gap:14px;align-items:center;justify-content:center}
.artrow .word{font-family:var(--display);font-size:34px;font-weight:700}
.artrow .word small{display:block;font-size:16px;color:var(--mute);font-family:var(--body)}
.say{display:flex;flex-direction:column;gap:10px}
.sayb{background:var(--bg);border-radius:16px;padding:12px 14px;text-align:left;font-size:22px;min-height:60px}
.sayb span{display:block;color:var(--mute);font-size:16px;font-weight:700}
/* builder */
.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:96px;align-content:flex-start;border:2px dashed var(--line);border-radius:16px;padding:12px}
.slots .w{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:6px 14px;font-size:24px;font-family:var(--display);font-weight:600}.slots .w.pk{background:var(--pink-soft);border-color:var(--pink);color:var(--pink)}
.slots .ph{color:var(--mute);font-size:17px}
.msg{min-height:56px;border-radius:16px;background:var(--turq-soft);padding:10px 14px;font-size:18px}
.msg b{font-family:var(--display);font-size:22px;font-weight:600;margin-right:6px}
.msg.bad{background:var(--pink-soft)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices .opt{flex:1;min-width:30%;text-align:center;min-height:52px}
.stickerpop{font-family:var(--display);font-size:38px;color:var(--fg);font-weight:700;border:3px solid var(--turq);background:var(--turq-soft);border-radius:24px;padding:14px 26px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-height:700px){.prompt{font-size:24px}.opt{min-height:50px;font-size:18px}.prof img{width:72px;height:72px}body{font-size:17px}.slots{min-height:80px}}

/* rounds, foil, stars */
.bigplay{font-family:var(--display);font-weight:600;font-size:28px;min-height:88px;border-radius:24px;background:var(--blue);color:var(--blue-fg);width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:var(--shadow)}
.bigplay small{font-family:var(--body);font-size:16px;font-weight:700;margin-top:4px}
.stk .s.foil{border:3px solid var(--gold);background:linear-gradient(135deg,#FFF1CC,#F6D77E 55%,#FFF1CC);color:var(--fg);position:relative}
.stk .s.foil::after{content:"";position:absolute;top:4px;right:6px;width:10px;height:10px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.stk .s.fresh{border-color:var(--pink);background:var(--pink-soft);color:var(--pink)}
.foilpop{font-family:var(--display);font-size:42px;font-weight:700;border:4px solid var(--gold);background:linear-gradient(135deg,#FFF1CC,#F6D77E 55%,#FFF1CC);border-radius:28px;padding:16px 32px;color:var(--fg)}
.meter{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px;width:100%}
.meter i{display:block;height:100%;background:var(--gold)}
.goal{width:100%;text-align:left;font-size:18px}
.goal b{font-family:var(--display);font-weight:600}
.pop2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.quiet{background:transparent;border:2px solid var(--line);font-size:19px;min-height:52px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* BOH · Italiano 2 · Bonus · Dove vai? 2 (vado, vai, vengo, vieni). Content only.
   Level: io and tu, posso/puoi, devo/devi, voglio/vuoi, andare, a or in (Dove vai? 1), Domani vado (taught).
   New here: vai, vengo, vieni, venire, con me, con te. No articulated prepositions anywhere. */
var KEY = 'boh_andare2_v1';

/* seven places that make sense in a plan (no bagno, infermeria or l'acqua here) */
var PL = {
  casa:       { it: 'casa',       en: 'home',            prep: 'a',  t3: 'Bullseye: a home, school or city is a point. Use a.',            t4: 'Casa = home.' },
  scuola:     { it: 'scuola',     en: 'to school',       prep: 'a',  t3: 'Bullseye: a home, school or city is a point. Use a.',        t4: 'Scuola = school.' },
  Roma:       { it: 'Roma',       en: 'to Rome',         prep: 'a',  t3: 'Bullseye: a home, school or city is a point. Use a.',          t4: 'Roma = Rome.' },
  palestra:   { it: 'palestra',   en: 'to the gym',      prep: 'in', t3: 'Pool: a room or a country is big. Use in.',      t4: 'La palestra = the gym.' },
  biblioteca: { it: 'biblioteca', en: 'to the library',  prep: 'in', t3: 'Pool: a room or a country is big. Use in.',    t4: 'La biblioteca = the library.' },
  mensa:      { it: 'mensa',      en: 'to the cafeteria',prep: 'in', t3: 'Pool: a room or a country is big. Use in.',         t4: 'La mensa = the cafeteria.' },
  Italia:     { it: 'Italia',     en: 'to Italy',        prep: 'in', t3: 'Pool: a room or a country is big. Use in.',            t4: "L'Italia = Italy." }
};
var PLACE_IDS = ['casa', 'scuola', 'Roma', 'palestra', 'biblioteca', 'mensa', 'Italia'];
var STICKERS = ['vado', 'vai', 'stasera', 'domani', 'vengo', 'vieni'];

var R_OK = ['Bene!', 'Ottimo!', 'Eccellente!', 'Ue!'];
var R_BAD = ['Quasi!', 'Non ancora', 'Ma no!'];
var R_PART = 'E!!';
var R_HELP = 'E dai!';

/* ---------- the sentence generator: every sentence is built from parts, so the grammar is always right ---------- */
var TIME_EN = { Stasera: 'Tonight', Domani: 'Tomorrow' };
var VERB_WRONG = { vado: ['vai', 'vengo'], vai: ['vado', 'vieni'], vengo: ['vado', 'vieni'], vieni: ['vai', 'vengo'], venire: ['andare', 'vengo'], andare: ['venire', 'vado'] };
var TIP = {
  time: 'Stasera = tonight. Domani = tomorrow.',
  vado: 'Vado = I go. Vai = you go.', vai: 'Vai = you go. Vado = I go.',
  vengo: 'Vengo = I come. Vieni = you come.', vieni: 'Vieni = you come. Vengo = I come.',
  venire: 'After vuoi, posso, puoi: venire stays whole.', andare: 'After voglio, devo, devi: andare stays whole.',
  modal: 'Voglio, devo, posso = I. Vuoi, devi, puoi = you.',
  conme: 'I come with YOU: con te. You come with ME: con me.',
  chunk: 'a + a verb: go AT it. a prendere.'
};
var MODAL_GROUP = { io: ['Voglio', 'Devo', 'Posso'], tu: ['Vuoi', 'Devi', 'Puoi'] };

function P(r, v, wrong, tip) { return { r: r, v: v, wrong: wrong, tip: tip }; }
function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1) }
function placeWrong(pid) { return PLACE_IDS.filter(function (x) { return PL[x].prep === PL[pid].prep && x !== pid }).map(function (x) { return PL[x].it }) }
function pPrep(pid) { return P('prep', PL[pid].prep, [PL[pid].prep === 'a' ? 'in' : 'a'], PL[pid].t3) }
function pPlace(pid) { return P('place', PL[pid].it, placeWrong(pid), PL[pid].t4) }
function pTime(t) { return P('time', t, [t === 'Stasera' ? 'Domani' : 'Stasera'], TIP.time) }
/* verb part: capitalised only when it opens the sentence */
function pVerb(v, cap) { var f = function (x) { return cap ? cap1(x) : x }; return P('verb', f(v), VERB_WRONG[v].map(f), TIP[v]) }
function pConme(w) { return P('conme', w, [w === 'con me' ? 'con te' : 'con me'], TIP.conme) }
function pModal(m, grp) { return P('modal', m, MODAL_GROUP[grp].filter(function (x) { return x !== m }), TIP.modal) }

function mk(parts, punct, en, tags) {
  var it = parts.map(function (p) { return p.v }).join(' ') + punct;
  return { it: it, en: en, parts: parts, punct: punct, tags: tags, key: it };
}
function dest(pid) { return PL[pid].en }
var ALL = [];
(function () {
  var T = ['Stasera', 'Domani'];
  /* plans: [time] + vado / vai + a|in + place */
  [null, 'Stasera', 'Domani'].forEach(function (t) {
    ['vado', 'vai'].forEach(function (v) {
      PLACE_IDS.forEach(function (pid) {
        var parts = []; if (t) parts.push(pTime(t));
        parts.push(pVerb(v, !t)); parts.push(pPrep(pid)); parts.push(pPlace(pid));
        var en = v === 'vado'
          ? (t ? TIME_EN[t] + " I'm going " + dest(pid) + '.' : "I'm going " + dest(pid) + '.')
          : (t ? TIME_EN[t] + ', are you going ' + dest(pid) + '?' : 'Are you going ' + dest(pid) + '?');
        ALL.push(mk(parts, v === 'vado' ? '.' : '?', en, [v, 'p:' + pid].concat(t ? [t.toLowerCase()] : [])));
      });
    });
  });
  /* coming: Vieni con me? / Vengo con te. */
  ALL.push(mk([pVerb('vieni', true), pConme('con me')], '?', 'Are you coming with me?', ['vieni', 'conme']));
  ALL.push(mk([pVerb('vengo', true), pConme('con te')], '.', "I'm coming with you.", ['vengo', 'conme']));
  /* modal + venire + con me / con te */
  [['Vuoi', 'tu', 'con me', '?', 'Do you want to come with me?'], ['Puoi', 'tu', 'con me', '?', 'Can you come with me?'], ['Devi', 'tu', 'con me', '?', 'Do you have to come with me?'],
   ['Posso', 'io', 'con te', '?', 'Can I come with you?'], ['Voglio', 'io', 'con te', '.', 'I want to come with you.'], ['Devo', 'io', 'con te', '.', 'I have to come with you.']].forEach(function (x) {
    ALL.push(mk([pModal(x[0], x[1]), pVerb('venire', false), pConme(x[2])], x[3], x[4], ['venire', 'conme']));
  });
  /* Vuoi venire a|in place? */
  PLACE_IDS.forEach(function (pid) {
    ALL.push(mk([pModal('Vuoi', 'tu'), pVerb('venire', false), pPrep(pid), pPlace(pid)], '?', 'Do you want to come ' + dest(pid) + '?', ['venire', 'p:' + pid]));
  });
  /* time + vengo / vieni + a|in place + con te / con me */
  T.forEach(function (t) {
    PLACE_IDS.forEach(function (pid) {
      ALL.push(mk([pTime(t), pVerb('vengo', false), pPrep(pid), pPlace(pid), pConme('con te')], '.', TIME_EN[t] + " I'm coming " + dest(pid) + ' with you.', ['vengo', t.toLowerCase(), 'p:' + pid, 'conme']));
      ALL.push(mk([pTime(t), pVerb('vieni', false), pPrep(pid), pPlace(pid), pConme('con me')], '?', TIME_EN[t] + ', are you coming ' + dest(pid) + ' with me?', ['vieni', t.toLowerCase(), 'p:' + pid, 'conme']));
    });
  });
  /* the water bottle line, as in the Posso, devo, voglio bonus */
  ALL.push(mk([pModal('Devi', 'tu'), pVerb('andare', false), P('chunk', "a prendere l'acqua", ["in prendere l'acqua", 'a casa'], TIP.chunk)], '?', 'Do you have to go get water?', ['andare', 'acqua']));
})();

/* the English for the 'home' sentences reads "I'm going home" and "are you going home" */

/* odd-but-correct sentences removed (teacher chose "remove the odd ones"): nobody goes to school or to Italy tonight, and "Vuoi venire a casa?" is ambiguous */
ALL = ALL.filter(function (s) {
  var tags = s.tags;
  if (tags.indexOf('stasera') !== -1 && (tags.indexOf('p:scuola') !== -1 || tags.indexOf('p:Italia') !== -1)) return false;
  if (s.it === 'Vuoi venire a casa?') return false;
  return true;
});

/* ---------- mini lessons (cards of a swipe). kind: meet | say | try ---------- */
var L1 = {
  id: 'L1',
  cards: [
    { kind: 'meet', prof: 'Ue! Pronti?', tip: 'You know Domani vado. Vado = I go. Now meet vai = you go.',
      big: 'vado · vai', eq: 'I go · you go',
      pairs: [['<b>Vado</b> a casa.', "I'm going home."], ['<b>Vai</b> a scuola?', 'Are you going to school?'], ['<b>Stasera</b> vado in mensa.', "Tonight I'm going to the cafeteria."]] },
    { kind: 'say', prof: 'Ascolta. Ripeti.', tip: 'Tap each line.',
      lines: [['Stasera vado in palestra.', "Tonight I'm going to the gym."], ['Domani vai a Roma?', 'Tomorrow, are you going to Rome?'], ['Vado a casa.', "I'm going home."]] },
    { kind: 'try', prof: 'Capisci?', tip: 'Pick the one that works.',
      q: 'Are you going to school?', opts: ['Vado a scuola?', 'Vai a scuola?', 'Vai in scuola?'], ok: 'Vai a scuola?',
      why: 'You go = vai. School is a point: a scuola.' }
  ]
};
var L2 = {

  if(b.n>=b.steps.length){b.done=true;run.streak=b.anyMiss?0:run.streak+1;if(run.streak>st.streakBest)st.streakBest=run.streak;

  else b.msg='<b>'+R_PART+'</b>'}

/* ---------- checking: forgive typos, not grammar ---------- */
function norm(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[?.!,;:]/g,'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim()}
function ed(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++){var c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function wordOk(got,want){if(got===want)return true;if(GRAMMAR.indexOf(want)!==-1||GRAMMAR.indexOf(got)!==-1)return false;return want.length>=4&&ed(got,want)<=1}
function sentOk(typed,answer){var a=norm(typed).split(' '),b=norm(answer).split(' ');if(a.length!==b.length)return false;for(var i=0;i<a.length;i++)if(!wordOk(a[i],b[i]))return false;return true}

/* ---------- the round: 6 items, easy to hard and back to an easy finish ---------- */
var POS_TYPE=['slot','build','build','slot','type','build'];
var POS_DIFF=['easy','med','hard','easy','med','easy'];
function mastery(s){var t=s.tags,sum=0;for(var i=0;i<t.length;i++)sum+=(st.mast[t[i]]||0);return sum/t.length}
function seenN(s){return st.seen[s.key]||0}
function blankable(s){return s.parts.some(function(p){return p.r==='prep'||p.r==='verb'||p.r==='conme'||p.r==='modal'})}
function pickSentence(diff,type){
 var c=ALL.filter(function(s){return !run.used[s.key]&&(type!=='slot'||blankable(s))});
 if(!c.length)c=ALL.filter(function(s){return !run.used[s.key]});
 c=shuffle(c);
 c.sort(function(a,b){
  var sa=seenN(a),sb=seenN(b);if(sa!==sb)return sa-sb;
  var ca=a.parts.length,cb=b.parts.length,ma=mastery(a),mb=mastery(b);
  if(diff==='easy'){if(ma!==mb)return mb-ma;return ca-cb}
  if(diff==='hard'){if(ca!==cb)return cb-ca;return ma-mb}
  var da=Math.abs(ca-3),db=Math.abs(cb-3);if(da!==db)return da-db;return 0});
 return c[0]}
function pickItem(pos){var type=POS_TYPE[pos],diff=POS_DIFF[pos];var s=pickSentence(diff,type);run.used[s.key]=1;
 if(type==='build')return {t:'build',sent:s,diff:diff};
 if(type==='type')return {t:'type',hear:s.it,en:s.en,answer:s.it,sent:s,diff:diff};
 var idx=[];s.parts.forEach(function(p,i){if(p.r==='prep'||p.r==='verb'||p.r==='conme'||p.r==='modal')idx.push(i)});
 var bi=rnd(idx),bp=s.parts[bi];
 var txt=s.parts.map(function(p,i){return i===bi?'<span class="pk">___</span>':p.v}).join(' ')+s.punct;
 return {t:'mc',kick:'Slot it · Completa',prompt:txt,sub:s.en,say:s.it,answer:bp.v,opts:shuffle([bp.v].concat(shuffle(bp.wrong).slice(0,2))),why:bp.tip,sent:s,diff:diff}}
function startRound(){run={mode:'round',items:[],i:0,hearts:3,streak:0,res:[],used:{},newStk:[],revealed:false,page:0};card()}

/* record what happened on one item: skill, history, stickers */
function finishItem(it,ok,built){
 var s=it.sent;if(!s)return;
 run.res.push(ok);
 s.tags.forEach(function(t){var v=(st.mast[t]||0)+(ok?1:-2);st.mast[t]=Math.max(-3,Math.min(5,v))});

 if(ok||built){s.tags.forEach(function(t){if(STICKERS.indexOf(t)!==-1&&st.stickers.indexOf(t)===-1){st.stickers.push(t);run.newStk.push(t)}})}
 if(st.sent.indexOf(s.it)===-1){st.sent.push(s.it);if(st.sent.length>12)st.sent.shift()}
 save()}

  if(run.mode==='learn'&&!it.again&&it.t!=='lesson'){var again=JSON.parse(JSON.stringify(it));again.again=true;again.kick='Ancora una volta · '+(it.kick||'');if(again.opts)again.opts=shuffle(again.opts);run.items.splice(Math.min(run.i+3,run.items.length),0,again)}}
