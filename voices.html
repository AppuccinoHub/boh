<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Boh Voice Check</title>
<style>
  :root{--bg:#fbf3ec;--ink:#231815;--mut:#6f5e56;--line:#e6d8cf;--card:#fff;--go:#e8845f;--vio:#6b4a8a;--warn:#fff3cd}
  @media (prefers-color-scheme:dark){:root{--bg:#231815;--ink:#fbf3ec;--mut:#c9b8ae;--line:#4a3a34;--card:#2f221e;--warn:#4a3d12}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  main{max-width:760px;margin:0 auto}h1{margin:0 0 4px;font-size:24px}p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
  .warn{background:var(--warn);border-color:transparent}
  button{font:700 15px/1 system-ui,sans-serif;min-height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--vio);color:#fff;cursor:pointer}
  button.go{background:var(--go)}button.ghost{background:var(--line);color:var(--ink)}
  .v{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
  .v.pick{border-color:var(--go)}.v .t{flex:1;min-width:0}.v b{word-break:break-word}.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 8px;background:var(--line);margin-right:4px}
  .tag.bad{background:#f4b9a8;color:#231815}.tag.ok{background:#bfe6c4;color:#231815}
  textarea{width:100%;min-height:150px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
  label.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input[type=range]{flex:1;min-width:140px}
</style>
</head>
<body>
<main>
  <h1>🔊 Boh Voice Check</h1>
  <p class="mut">Open this page on a student Chromebook, tap Test on each voice, and send me a screenshot (or tap “Copy report” and paste it to me). Nothing is saved or sent.</p>

  <div class="card" id="dev"></div>
  <div id="verdict"></div>

  <div class="card">
    <label class="r"><b>Speed</b> <input type="range" id="rate" min="0.4" max="1.2" step="0.05" value="0.9"> <span id="rv">0.90</span></label>
    <p class="mut">The game never goes below 0.70 on Chromebooks. Slide down to 0.55 to hear why.</p>
    <label class="r"><input type="checkbox" id="all"> Show every voice (not only Italian)</label>
  </div>

  <div id="list"></div>

  <div class="card">
    <button class="go" id="copy">Copy report</button>
    <p class="mut">Then paste it into the chat with me.</p>
    <textarea id="rep" readonly></textarea>
  </div>
</main>
<script src="assets/bohvoice.js"></script>
<script>
(function () {
  var BV = window.BohVoice, TEST = 'Ciao! Mi chiamo Boh. Quando ero piccola, abitavo a Hamilton e giocavo con i miei amici.';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function render() {
    var vs = BV ? ($('all').checked ? BV.all() : BV.list()) : [], pick = BV && BV.pick(), it = BV ? BV.list() : [];
    var ua = navigator.userAgent, os = /CrOS/.test(ua) ? 'Chromebook (ChromeOS)' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : /Android/.test(ua) ? 'Android' : 'Other';
    var chrome = (ua.match(/Chrome\/([\d.]+)/) || [])[1] || '';
    $('dev').innerHTML = '<b>' + esc(os) + '</b><div class="mut">Chrome ' + esc(chrome) + ' · online: ' + (navigator.onLine ? 'yes' : 'no') + ' · Italian voices found: <b>' + it.length + '</b> · all voices: ' + (BV ? BV.all().length : 0) + '</div>';
    var v = '';
    if (!window.speechSynthesis) v = '<div class="card warn"><b>This browser has no speech at all.</b> The game will be silent here.</div>';
    else if (!it.length) v = '<div class="card warn"><b>No Italian voice found.</b> If this is a Chromebook and the voice list is still loading, wait 5 seconds and reload. Otherwise the game will be silent here.</div>';
    else if (BV.onlyRobotic()) v = '<div class="card warn"><b>Only a robotic Italian voice (eSpeak) is installed.</b> That is the “broken robot” sound. The game will use it because nothing else exists. The fix is real recorded audio, not a setting.</div>';
    else v = '<div class="card"><b>A natural Italian voice exists:</b> ' + esc(pick ? pick.name : '') + '. The game now picks it automatically.</div>';
    $('verdict').innerHTML = v;
    var h = '';
    vs.forEach(function (x, i) {
      var isIt = /^it/i.test(x.lang || '');
      h += '<div class="v' + (pick && x === pick ? ' pick' : '') + '"><div class="t"><b>' + esc(x.name) + '</b><div>' +
        '<span class="tag">' + esc(x.lang) + '</span>' + '<span class="tag ' + (x.localService ? '' : '') + '">' + (x.localService ? 'on this computer' : 'online') + '</span>' +
        (BV.isRobotic(x) ? '<span class="tag bad">robotic</span>' : (isIt ? '<span class="tag ok">natural?</span>' : '')) +
        (pick && x === pick ? '<span class="tag ok">Boh uses this</span>' : '') + '</div></div><button data-i="' + i + '">▶ Test</button></div>';
    });
    $('list').innerHTML = h || '<div class="card mut">No voices to show.</div>';
    $('list').onclick = function (e) { var b = e.target.closest('button[data-i]'); if (!b) return; var x = vs[+b.getAttribute('data-i')]; BV.speak(TEST, { voice: x, rate: parseFloat($('rate').value), raw: true }); };
    var rep = ['Boh Voice Check', 'Device: ' + os + ' | Chrome ' + chrome + ' | online ' + navigator.onLine, 'UA: ' + ua, 'Italian voices: ' + it.length + ' | all voices: ' + (BV ? BV.all().length : 0),
      'Boh would use: ' + (pick ? pick.name + ' (' + pick.lang + ', ' + (pick.localService ? 'local' : 'online') + ')' : 'NONE'), ''];
    (BV ? BV.all() : []).forEach(function (x) { rep.push((/^it/i.test(x.lang) ? 'IT ' : '   ') + x.name + ' | ' + x.lang + ' | ' + (x.localService ? 'local' : 'online') + (BV.isRobotic(x) ? ' | ROBOTIC' : '')); });
    $('rep').value = rep.join('\n');
  }
  $('rate').oninput = function () { $('rv').textContent = parseFloat(this.value).toFixed(2); };
  $('all').onchange = render;
  $('copy').onclick = function () { var t = $('rep'); t.select(); try { document.execCommand('copy'); this.textContent = 'Copied ✓'; } catch (e) { this.textContent = 'Select the text and copy it'; } };
  render(); var n = 0, last = BV ? BV.all().length : 0, iv = setInterval(function () { var c = BV ? BV.all().length : 0; if (c !== last) { last = c; render(); } if (++n > 20) clearInterval(iv); }, 500);
  if (window.speechSynthesis) try { speechSynthesis.addEventListener('voiceschanged', render); } catch (e) {}
})();
</script>
</body>
</html>
