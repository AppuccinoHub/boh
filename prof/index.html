<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Boh · Prof: leggi le consegne</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{color-scheme:light}
[data-theme="light"]{--bg:#EFE6E8;--surface:#fff;--card-border:#DDD0D5;--text:#2B2430;--muted:#6B5F68;--faint:#948892;--accent:#6A4C93;--primary:#C1654F;--primary-text:#fff;--ok-bg:#E6F5EC;--ok:#2F7D4F;--bad-bg:#FBEAE7;--bad:#B5473C;--warn-bg:#FBEEDD;--warn:#8A5A12;--field:#F5EFEF;--hl:#FFE98A}
[data-theme="dark"]{color-scheme:dark;--bg:#1C1520;--surface:#251C2A;--card-border:#362A3D;--text:#F2EAF0;--muted:#B7A8B8;--faint:#8A7A8C;--accent:#B79AE0;--primary:#E88A6C;--primary-text:#241318;--ok-bg:rgba(124,217,160,.14);--ok:#7CD9A0;--bad-bg:rgba(240,120,100,.16);--bad:#F59A8D;--warn-bg:rgba(230,170,80,.15);--warn:#F0C27A;--field:#1C1520;--hl:#6B5A10}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Manrope,system-ui,-apple-system,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
h1{font:800 32px/1.05 "Bricolage Grotesque",sans-serif;margin:6px 0 4px}
.eyebrow{font:700 13px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.muted{color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--card-border);border-radius:18px;padding:16px;margin:12px 0}
textarea,input[type=text],input[type=number],input[type=password]{width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--card-border);background:var(--field);color:var(--text);font:600 15px Manrope,sans-serif}
textarea{min-height:90px;resize:vertical}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:11px 18px;border-radius:12px;background:var(--primary);color:var(--primary-text);font:800 15px "Bricolage Grotesque",sans-serif;text-align:center}
.btn.ghost{background:var(--surface);color:var(--text);border:2px solid var(--card-border)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.item{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--card-border);display:flex;flex-direction:column;gap:3px}
.item.on{border-color:var(--accent)}
.item b{font-weight:800}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--field);color:var(--muted);border:1px solid var(--card-border);margin:2px 4px 2px 0}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.stat{padding:8px 10px;border-radius:12px;background:var(--field);border:1px solid var(--card-border)}
.stat b{display:block;font:800 20px "Bricolage Grotesque",sans-serif}
.stat span{font-size:12px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.essay{white-space:pre-wrap;font-size:18px;line-height:1.7;padding:14px;border-radius:14px;background:var(--field);border:1px solid var(--card-border)}
.essay mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 2px}
.q{font-weight:800;margin:12px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;margin:10px 0 4px}
.chip{all:unset;cursor:pointer;padding:5px 10px;border-radius:999px;font-weight:700;font-size:13px;background:var(--field);border:1.5px solid var(--card-border)}
.seg{display:inline-flex;border:2px solid var(--card-border);border-radius:12px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:8px 14px;font-weight:800;font-size:14px}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
[hidden]{display:none!important}
.sig{margin-top:30px;text-align:center;font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.05em}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="sig">Created by Assunta Scotto 2026</div>
<script>
(function () {
  var PIN_HASH = '1b0fa6c4c967f1c21f9c23ecc41ef8a27528a7be52b29d65d47123f5ac18d5be', SALT = 'boh-consegna-v1';
  var app = document.getElementById('app'), TASKS = [], LV = {}, SUBS = [], SEL = -1;
  try { var th = localStorage.getItem('boh_theme'); document.documentElement.setAttribute('data-theme', th === 'dark' || (!th && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'); } catch (e) {}
  function lsGet(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var MARKS = lsGet('boh_prof_marks_v1', {});
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  async function sha(s) { return hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))); }
  function fromB64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  async function unpack(code) {
    var m = /^BOH1\.([A-Za-z0-9_-]+)\.([0-9a-f]{16})$/.exec(code); if (!m) throw new Error('format');
    var okSig = (await sha(SALT + '.' + m[1])).slice(0, 16) === m[2], tag = m[1][0], bytes = fromB64u(m[1].slice(1));
    if (tag === 'z') { var ds = new DecompressionStream('gzip'), w = ds.writable.getWriter(); w.write(bytes); w.close(); bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer()); }
    return { p: JSON.parse(new TextDecoder().decode(bytes)), sig: m[2], intact: okSig, code: code };
  }

  // ---- common Italian words that are never "new" (articles, prepositions, pronouns, auxiliaries, connectors)
  var BASE = ('il lo la i gli le l un uno una un\' di a da in con su per tra fra del dello della dei degli delle al allo alla ai agli alle dal dallo dalla dai dagli dalle nel nello nella nei negli nelle sul sullo sulla sui sugli sulle ' +
    'io tu lui lei noi voi loro mi ti si ci vi lo la li le ne e ed o ma però anche se che chi cui come quando dove perché perche mentre quindi poi allora così ' +
    'non più molto poco tanto troppo sempre mai già ancora oggi ieri domani adesso ora qui là lì sì no ' +
    'sono sei è e siamo siete era ero eri eravamo eravate erano ho hai ha abbiamo avete hanno avevo avevi aveva avevamo avevate avevano sarò sarà avrò avrà ' +
    'mio mia miei mie tuo tua tuoi tue suo sua suoi sue nostro nostra nostri nostre vostro vostra vostri vostre questo questa questi queste quello quella ' +
    'ciao grazie prego scusa per favore buongiorno buonasera arrivederci ' +
    'uno due tre quattro cinque sei sette otto nove dieci venti trenta cento mille primo prima secondo seconda terzo').split(/\s+/);
  function normTok(t) { return t.toLowerCase().replace(/[’`]/g, "'"); }

  function allowedFor(p) {
    var t = TASKS.find(function (x) { return x.id === p.t; }); if (!t) return null;
    var set = {};
    function add(w) { w = normTok(w); if (!w) return; set[w] = 1; w.split("'").forEach(function (x) { if (x) set[x] = 1; }); }
    BASE.forEach(add);
    (t.vocab || []).forEach(add);
    var txt = [t.prompt, t.title].concat(t.frames || [], t.questions || []).join(' ');
    (txt.match(/[A-Za-zÀ-ÿ'’]+/g) || []).forEach(add);
    // everything in earlier tasks of the same level also counts as taught
    TASKS.forEach(function (o) { if (o.level === t.level) (o.vocab || []).forEach(add); });
    return t.vocab && t.vocab.length ? set : null;   // AP has no fixed list: no highlighting
  }
  function stem(set, w) { if (w.length < 6) return false; var st = w.slice(0, w.length - 3); if (!set.__keys) Object.defineProperty(set, '__keys', { value: Object.keys(set) }); return set.__keys.some(function (k) { return k.length >= 4 && k.indexOf(st) === 0; }); }
  function mark(text, set) {
    var out = '', last = 0, n = 0, re = /[A-Za-zÀ-ÿ'’]+/g, m;
    while ((m = re.exec(text))) {
      out += esc(text.slice(last, m.index)); last = re.lastIndex;
      var w = normTok(m[0]), parts = w.split("'").filter(Boolean);
      var known = !set || set[w] || parts.every(function (x) { return set[x] || stem(set, x); }) || /^\d+$/.test(w);
      if (known) out += esc(m[0]); else { n++; out += '<mark>' + esc(m[0]) + '</mark>'; }
    }
    return { html: out + esc(text.slice(last)), n: n };
  }
  function flags(s) {
    var p = s.p, st = p.st || {}, f = [], mins = (st.activeMs || 0) / 60000, wpm = mins > 0 ? Math.round(p.words / mins) : 0;
    if (!s.intact) f.push(['bad', 'Code was edited']);
    if (st.paste) f.push(['bad', st.paste + ' paste attempt' + (st.paste > 1 ? 's' : '')]);
    if (st.drop) f.push(['bad', st.drop + ' drag-and-drop attempt' + (st.drop > 1 ? 's' : '')]);
    if (st.jumps) f.push(['warn', st.jumps + ' text jump' + (st.jumps > 1 ? 's' : '') + ' (up to ' + st.maxJump + ' characters at once)']);
    if (p.words >= 20 && st.activeMs < 20000) f.push(['bad', p.words + ' words but only ' + Math.round((st.activeMs || 0) / 1000) + ' s of typing']);
    else if (wpm > 55 && p.words >= 30) f.push(['warn', wpm + ' words per minute is fast']);
    if (st.leaves >= 3 || st.awayMs > 120000) f.push(['warn', 'Left the page ' + st.leaves + '× (' + Math.round(st.awayMs / 1000) + ' s away)']);
    if (p.words < p.minWords) f.push(['warn', 'Under the minimum (' + p.words + '/' + p.minWords + ')']);
    return { list: f, wpm: wpm };
  }
  function fmtT(ms) { var s = Math.round((ms || 0) / 1000), m = Math.floor(s / 60); return m ? m + ' min ' + (s % 60) + ' s' : s + ' s'; }

  function gate() {
    app.innerHTML = '<div class="eyebrow">Prof</div><h1>Leggi le consegne</h1><div class="card" style="max-width:420px"><label class="f" for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"><div class="row" style="margin-top:10px"><button class="btn" id="ok">Entra</button><span id="gm" class="muted"></span></div></div>';
    var go = async function () { var v = app.querySelector('#pin').value.trim(); if ((await sha(v)) === PIN_HASH) { sessionStorage.setItem('boh_prof_ok', '1'); main(); } else { app.querySelector('#gm').textContent = 'PIN sbagliato.'; app.querySelector('#pin').value = ''; } };
    app.querySelector('#ok').onclick = go; app.querySelector('#pin').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }
  function main() {
    app.innerHTML = '<div class="eyebrow">Prof</div><h1>Leggi le consegne</h1><p class="muted">Paste one or more codes from Google Classroom. Marks stay in this browser.</p>' +
      '<div class="card"><textarea id="codes" placeholder="BOH1.…"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="load">Carica</button><button class="btn ghost" id="csv" hidden>Copia tutti i voti</button><span id="lm" class="muted"></span></div></div><div id="view"></div>';
    app.querySelector('#load').onclick = load; app.querySelector('#csv').onclick = copyAll;
  }
  async function load() {
    var raw = app.querySelector('#codes').value, found = raw.match(/BOH1\.[A-Za-z0-9_-]+\.[0-9a-f]{16}/g) || [], bad = 0;
    for (var i = 0; i < found.length; i++) {
      if (SUBS.some(function (s) { return s.code === found[i]; })) continue;
      try { SUBS.push(await unpack(found[i])); } catch (e) { bad++; }
    }
    app.querySelector('#lm').textContent = SUBS.length + ' loaded' + (bad ? ', ' + bad + ' unreadable' : '');
    if (!found.length) app.querySelector('#lm').textContent = 'No code found. A code starts with BOH1.';
    app.querySelector('#csv').hidden = !SUBS.length; if (SEL < 0 && SUBS.length) SEL = 0; draw();
  }
  function draw() {
    var v = app.querySelector('#view'); if (!SUBS.length) { v.innerHTML = ''; return; }
    var h = '<div class="grid"><div class="list">';
    SUBS.forEach(function (s, i) {
      var f = flags(s), mk = MARKS[s.sig], bad = f.list.filter(function (x) { return x[0] === 'bad'; }).length;
      h += '<button class="item' + (i === SEL ? ' on' : '') + '" data-i="' + i + '"><b>' + esc(s.p.name) + '</b><span class="muted" style="font-size:13px">' + esc(s.p.title) + '</span><span>' +
        '<span class="pill ' + (s.p.kind === 'summative' ? 'warn' : 'ok') + '">' + (s.p.kind === 'summative' ? 'Summativa' : 'Formativa') + '</span>' + (bad ? '<span class="pill bad">⚑ ' + bad + '</span>' : (f.list.length ? '<span class="pill warn">' + f.list.length + ' nota</span>' : '<span class="pill ok">ok</span>')) + (mk && mk.score !== '' ? '<span class="pill">' + esc(mk.score) + '/' + esc(mk.out) + '</span>' : '') + '</span></button>';
    });
    h += '</div><div id="det"></div></div>'; v.innerHTML = h;
    v.querySelectorAll('.item').forEach(function (b) { b.onclick = function () { SEL = +b.getAttribute('data-i'); draw(); }; });
    detail();
  }
  function detail() {
    var s = SUBS[SEL], d = app.querySelector('#det'); if (!s) return;
    var p = s.p, st = p.st || {}, f = flags(s), set = allowedFor(p), off = 0, mk = MARKS[s.sig] || { kind: p.kind, score: '', out: p.kind === 'summative' ? 20 : 10, comment: '' };
    var body = p.parts.map(function (x) { var r = mark(x.a, set); off += r.n; return (x.q ? '<div class="q">' + esc(x.q) + '</div>' : '') + '<div class="essay">' + r.html + '</div>'; }).join('');
    var h = '<div class="card"><div class="eyebrow">' + esc(LV[p.l] || p.l) + ' · ' + esc(p.unit) + '</div><h2 style="font:800 26px/1.1 \'Bricolage Grotesque\',sans-serif;margin:6px 0">' + esc(p.name) + ' · ' + esc(p.title) + '</h2>' +
      '<div class="muted" style="font-size:14px">Boh: ' + esc(p.boh || '—') + ' · handed in ' + esc(new Date(p.at).toLocaleString()) + '</div>';
    h += '<div style="margin-top:8px">' + (f.list.length ? f.list.map(function (x) { return '<span class="pill ' + x[0] + '">' + (x[0] === 'bad' ? '⚑ ' : '') + esc(x[1]) + '</span>'; }).join('') : '<span class="pill ok">No flags</span>') + (set ? '<span class="pill">' + off + ' word' + (off === 1 ? '' : 's') + ' outside the lists</span>' : '') + '</div>';
    h += '<div class="stats"><div class="stat"><b>' + p.words + '</b><span>words</span></div><div class="stat"><b>' + fmtT(st.activeMs) + '</b><span>typing</span></div><div class="stat"><b>' + f.wpm + '</b><span>words/min</span></div><div class="stat"><b>' + fmtT(st.openMs) + '</b><span>page open</span></div><div class="stat"><b>' + (st.paste || 0) + '</b><span>paste tries</span></div><div class="stat"><b>' + (st.leaves || 0) + '</b><span>left page</span></div><div class="stat"><b>' + (st.sessions || 1) + '</b><span>sessions</span></div></div>';
    if (set) h += '<div class="muted" style="font-size:13px;margin-bottom:6px"><mark style="background:var(--hl);color:inherit;border-radius:4px;padding:0 3px">highlighted</mark> = not in the unit vocabulary or the prompt. A pointer, not proof.</div>';
    h += body + '</div>';
    h += '<div class="card"><div class="row"><div class="seg" role="group" aria-label="Tipo"><button data-k="formative" aria-pressed="' + (mk.kind === 'formative') + '">Formativa</button><button data-k="summative" aria-pressed="' + (mk.kind === 'summative') + '">Summativa</button></div>' +
      '<span class="row" style="gap:6px"><input id="sc" type="number" min="0" step="0.5" style="width:90px" value="' + esc(mk.score) + '" aria-label="Voto"> / <input id="ou" type="number" min="1" style="width:80px" value="' + esc(mk.out) + '" aria-label="Su"></span></div>' +
      '<label class="f" for="cm">Commento</label><textarea id="cm">' + esc(mk.comment) + '</textarea><div class="row" style="margin:8px 0">' +
      ['Ottimo lavoro!', 'Controlla gli accenti.', 'Controlla l\'accordo (genere/numero).', 'Controlla l\'ausiliare (essere/avere).', 'Controlla il participio.', 'Usa più vocabolario dell\'unità.', 'Aggiungi più dettagli.', 'Questo non sembra il tuo lavoro: ne parliamo?'].map(function (c) { return '<button class="chip" data-c="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') +
      '</div><div class="row"><button class="btn" id="cp">Copia il feedback</button><span id="cs" class="muted"></span></div></div>';
    d.innerHTML = h;
    function save() { MARKS[s.sig] = { kind: mk.kind, score: d.querySelector('#sc').value, out: d.querySelector('#ou').value, comment: d.querySelector('#cm').value, at: new Date().toISOString() }; lsSet('boh_prof_marks_v1', MARKS); mk = MARKS[s.sig]; }
    d.querySelectorAll('[data-k]').forEach(function (b) { b.onclick = function () { mk.kind = b.getAttribute('data-k'); save(); draw(); }; });
    d.querySelectorAll('[data-c]').forEach(function (b) { b.onclick = function () { var c = d.querySelector('#cm'); c.value = (c.value ? c.value.trim() + ' ' : '') + b.getAttribute('data-c'); save(); }; });
    ['#sc', '#ou', '#cm'].forEach(function (q) { d.querySelector(q).oninput = function () { save(); }; d.querySelector(q).onchange = function () { save(); draw(); }; });
    d.querySelector('#cp').onclick = function () {
      save(); var t = p.name + ' · ' + p.title + ' (' + (mk.kind === 'summative' ? 'Summativa' : 'Formativa') + ')\nVoto: ' + (mk.score === '' ? '—' : mk.score + '/' + mk.out) + '\n' + mk.comment;
      try { navigator.clipboard.writeText(t); d.querySelector('#cs').textContent = 'Copiato!'; } catch (e) { d.querySelector('#cs').textContent = 'Copy failed'; }
    };
  }
  function copyAll() {
    var rows = [['Nome', 'Livello', 'Compito', 'Tipo', 'Voto', 'Su', 'Parole', 'Segnalazioni', 'Commento']];
    SUBS.forEach(function (s) { var m = MARKS[s.sig] || {}, f = flags(s); rows.push([s.p.name, LV[s.p.l] || s.p.l, s.p.title, (m.kind || s.p.kind) === 'summative' ? 'Summativa' : 'Formativa', m.score || '', m.out || '', s.p.words, f.list.map(function (x) { return x[1]; }).join('; '), (m.comment || '').replace(/\s+/g, ' ')]); });
    var t = rows.map(function (r) { return r.join('\t'); }).join('\n');
    try { navigator.clipboard.writeText(t); app.querySelector('#lm').textContent = 'Copied: paste into Google Sheets.'; } catch (e) {}
  }
  fetch('../assets/tasks.json').then(function (r) { return r.json(); }).then(function (j) { TASKS = j.tasks; LV = j.levels; }).catch(function () {}).then(function () {
    if (sessionStorage.getItem('boh_prof_ok') === '1') main(); else gate();
  });
})();
</script>
</body>
</html>
