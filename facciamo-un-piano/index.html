/* Colors copied from assets/lezione.css (Boh color system): pink = the one thing to look at,
   blue = what to tap, turquoise = progress, green = correct. Created by Assunta Scotto, 2026. */
:root{--bg:#F7F4EE;--card:#FFFFFF;--line:#DAD7D0;--line2:#7E8792;--text:#0E2A5B;--mut:#46566E;--tap:#1A5CDF;--tap-text:#FFFFFF;

:root[data-theme="dark"]{--bg:#0C1421;--card:#151E2E;--line:#2C384D;--line2:#69788F;--text:#E6ECF2;--mut:#AAB5C4;--tap:#7FAEE9;--tap-text:#0A121F;

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:600 17px/1.45 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.dsp{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
:focus-visible{outline:3px solid var(--tap);outline-offset:2px}
h1{font:800 34px/1.05 "Bricolage Grotesque",sans-serif;margin:4px 0 6px}
h2{font:800 24px/1.15 "Bricolage Grotesque",sans-serif;margin:0 0 6px}
h3{font:800 19px/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 4px}
p{margin:0 0 10px}
.mut{color:var(--mut)}
.eyebrow{font:800 16px/1.2 "Bricolage Grotesque",sans-serif;letter-spacing:.06em;color:var(--prog);text-transform:uppercase}
.it{color:var(--pop);font-weight:800}
.top{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:8px}
.back{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line2);background:var(--card);font-weight:800;font-size:16px;text-decoration:none;color:var(--text)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;min-height:96px;padding:16px;border-radius:18px;background:var(--card);border:2px solid var(--line);text-decoration:none;color:var(--text)}
.tile:hover{border-color:var(--tap)}
.tile b{font:800 20px/1.15 "Bricolage Grotesque",sans-serif}
.tile .day{font:800 16px/1 "Bricolage Grotesque",sans-serif;color:var(--prog);text-transform:uppercase;letter-spacing:.06em}
.tile .turn{margin-top:auto;font-size:16px;font-weight:800;color:var(--mut)}
.tile.step{border-color:var(--tap);border-width:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:12px 22px;border-radius:14px;border:0;background:var(--tap);color:var(--tap-text);font:800 18px "Bricolage Grotesque",sans-serif;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--text);border:2px solid var(--line2)}
.btn.small{min-height:44px;padding:8px 14px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
label.f{display:block;font-size:16px;font-weight:800;color:var(--mut);margin:12px 0 4px}
input[type=text],select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--text);font:700 18px "Manrope",sans-serif}
.acc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.acc button{min-width:44px;min-height:44px;border-radius:12px;border:2px solid var(--line2);background:var(--card);font-weight:800;font-size:18px}
.dots{display:flex;gap:5px;margin:8px 0 12px}
.dots i{flex:1;height:8px;border-radius:99px;background:var(--track)}
.dots i.on{background:var(--prog)}
.dots i.cur{background:var(--pop)}
.sent{font:800 26px/1.3 "Bricolage Grotesque",sans-serif;margin:6px 0}
.sent .blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--pop);color:var(--pop);text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.opt{min-height:56px;padding:10px;border-radius:14px;border:2px solid var(--tap);background:var(--card);color:var(--text);font:800 20px "Bricolage Grotesque",sans-serif}
.opt.right{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-text)}
.opt.off{opacity:.45;border-color:var(--line2)}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0;border:2px solid var(--line2);background:var(--soft)}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-text)}
.fb b.ans{color:var(--pop);font-size:20px}
.fb.ok b.ans{color:inherit}
.tip{font-size:16px;margin-top:6px}
table.t{width:100%;border-collapse:collapse;margin:6px 0}
table.t td,table.t th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:17px;vertical-align:top}
table.t th{color:var(--mut);font-size:16px}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.who{flex:none;width:86px;font:800 16px/1.3 "Bricolage Grotesque",sans-serif;color:var(--mut);padding-top:3px}
.line .txt{flex:1;min-width:0}
.line .txt .it{font-size:19px;display:block}
.en{display:block;color:var(--mut);font-size:16px;font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:16px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--tag);color:var(--text)}
.enb{flex:none;min-width:48px;min-height:44px;border-radius:12px;border:2px solid var(--line2);background:var(--card);font-weight:800;font-size:16px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{flex:none;width:28px;height:28px;margin:2px 0 0;accent-color:var(--prog)}
.found{font-size:16px;color:var(--mut);font-weight:700;display:block}
.found .y{color:var(--ok-text);font-weight:800}
.sline{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin:8px 0}
.sline .n{font:800 16px/1.2 "Bricolage Grotesque",sans-serif;color:var(--mut)}
.note{border-left:5px solid var(--prog);padding:8px 12px;background:var(--tag);border-radius:8px;margin:10px 0;font-size:16px}
.warn{color:var(--pop);font-weight:800;font-size:16px}
.credit{margin-top:28px;text-align:center;font-size:16px;color:var(--mut)}
#printview{display:none}
@media (max-width:480px){h1{font-size:29px}.sent{font-size:22px}.who{width:72px}.sline{grid-template-columns:1fr}}
@media print{
  body{background:#fff;color:#000;font-size:13pt}
  #app{display:none}
  #printview{display:block;padding:0 6mm}
  #printview h1{font-size:20pt;margin:0 0 4pt}
  #printview .pbox{border:1.5pt solid #000;border-radius:6pt;padding:8pt 10pt;margin:8pt 0;min-height:34pt;page-break-inside:avoid}
  #printview .pl{font-weight:800}
  #printview .pcredit{margin-top:14pt;font-size:10pt}
}
</style>

var PRACTICE={
 are:{title:'-are verbs',tense:'presente (present tense)',
  teach:'<p>Take off <span class="it" lang="it">-are</span> and add the ending for who is doing it.</p>'+
   '<table class="t"><tr><th>who</th><th>ending</th><th lang="it">guardare</th></tr>'+
   '<tr><td lang="it">io</td><td class="it">-o</td><td class="it" lang="it">guardo</td></tr><tr><td lang="it">tu</td><td class="it">-i</td><td class="it" lang="it">guardi</td></tr>'+

   '<p><b>Spelling change:</b> <span class="it" lang="it">giocare</span> adds an <b>h</b> before <b>i</b> to keep the hard k sound: <span class="it" lang="it">giochi</span>, <span class="it" lang="it">giochiamo</span>.</p>',
  tip:'io -o · tu -i · lui/lei -a · noi -iamo · voi -ate · loro -ano',
  items:[
   {k:'are',verb:'suonare',p:0,s:'io',b:'Io',a:'la chitarra.',en:'I play the guitar.',mode:'choose',o:[1,0,2]},
   {k:'are',verb:'ascoltare',p:1,s:'tu',b:'Tu',a:'la musica?',en:'Do you listen to music?',mode:'type'},

  ],
  easy:[['Which one means "I play"?','gioco','giochiamo'],['Which ending goes with noi?','-iamo','-o'],['Which one means "you watch" (tu)?','guardi','guardo']]},

   '<p>Then say where: <span class="it" lang="it">al cinema, al parco, al mare, in piscina, in centro, in palestra</span>.</p>',
  tip:'vado · vai · va · andiamo · andate · vanno',
  items:[
   {k:'andare',p:0,s:'io',b:'Io',a:'al cinema sabato.',en:'I am going to the movies on Saturday.',mode:'choose',o:[0,1,2]},
   {k:'andare',p:1,s:'tu',b:'Tu',a:'in palestra?',en:'Are you going to the gym?',mode:'type'},
   {k:'andare',p:3,s:'noi',b:'Noi',a:'al parco domenica.',en:'We are going to the park on Sunday.',mode:'type'},
   {k:'andare',p:2,s:'Aurora (lei)',b:'Aurora',a:'in centro.',en:'Aurora is going downtown.',mode:'choose',o:[1,5,2]},

  ],
  easy:[['Which one means "I want"?','voglio','vogliamo'],['Which one means "do you want" (tu)?','vuoi','voglio'],['After voglio, which form comes next?','giocare','gioco']]}
};

function forms(it){return it.k==='are'?conj(it.verb):it.k==='andare'?ANDARE:VOLERE;}
function answer(it){return it.k==='inf'?it.ans:forms(it)[it.p];}
function options(it){return it.k==='inf'?it.opts:it.o.map(function(i){return forms(it)[i];});}
function norm(s){s=String(s||'').toLowerCase().trim().replace(/[.?!,;:]+$/,'').replace(/\s+/g,' ');
  return s.replace(/^(io|tu|lui|lei|noi|voi|loro)\s+/,'');}

/* why a wrong answer is wrong (never just "incorrect") */
function why(it,raw){
  var a=norm(raw),right=answer(it),f,i;
  if(!a) return 'Nothing was typed yet. Type the form of the verb that fits the sentence, then check it.';
  if(it.k==='inf') return '"'+a+'" is a form that changes with the person. After volere the next verb does not change: it stays in the infinitive, the form ending in -are.';
  f=forms(it);i=f.indexOf(a);
  if(it.k==='are'){
    if(a===it.verb) return '"'+a+'" is the infinitive, the "to…" form. Take off -are and add the ending for '+it.s+': -'+END[it.p]+'.';
    if(i>-1&&i!==it.p) return '"'+a+'" is the '+P[i]+' form. The subject here is '+it.s+', so the ending is -'+END[it.p]+'.';
    if(it.verb==='giocare'&&(it.p===1||it.p===3)&&a===it.verb.slice(0,-3)+END[it.p]) return 'The ending is right, but giocare needs an h before i to keep the hard k sound. Without the h it would sound like "ch" in English.';
    if(a.slice(0,3)!==it.verb.slice(0,3)) return '"'+a+'" looks like a different verb. This sentence uses '+it.verb+'. For '+it.s+', take off -are and add -'+END[it.p]+'.';
    if(a.slice(-END[it.p].length)===END[it.p]) return 'The ending -'+END[it.p]+' is right for '+it.s+', but the first part of the verb is misspelled. Take off -are from '+it.verb+' and keep the rest.';
    return 'For '+it.s+', take off -are from '+it.verb+' and add -'+END[it.p]+'. "'+a+'" does not end in -'+END[it.p]+'.';
  }
  if(i>-1&&i!==it.p) return '"'+a+'" is the '+P[i]+' form. The subject here is '+it.s+'.';
  if(it.k==='andare'){
    if(/^and/.test(a)&&it.p!==3&&it.p!==4) return 'Andare is irregular. Only noi (andiamo) and voi (andate) start with and-. The other four forms start with va-.';
    if(/^and/.test(a)) return 'Close. '+P[it.p]+' does keep and-, but the ending is off. Noi ends in -iamo and voi ends in -ate.';
    if(/^va/.test(a)&&(it.p===3||it.p===4)) return 'Close. Noi and voi are the two forms that keep and- from andare. The va- forms are for io, tu, lui/lei and loro.';
    return 'Andare is irregular, so regular -are endings do not work here. "'+a+'" is not one of its six forms. Look at the table again.';
  }
  if(/^vol/.test(a)&&it.p===4) return 'Close. Voi does keep vol-, but the ending is off. Volere is an -ere verb, so the voi form ends in -ete.';
  if(/^vol/.test(a)&&it.p!==4) return 'Volere is irregular. Only voi (volete) keeps vol-. The other forms start with vogl- or vuo-.';
  return 'Volere is irregular. "'+a+'" is not one of its six forms: voglio, vuoi, vuole, vogliamo, volete, vogliono. Pick the one for '+it.s+'.';
}

function practice(key){
  var A=PRACTICE[key],queue=A.items.slice(),pos=0,tries=0,missRun=0,firstTry=0,easyUsed=0,timer=null;
  function clear(){if(timer){clearTimeout(timer);timer=null;}}
  stopPractice=clear;
  function intro(){
    app.innerHTML=top('Practice')+'<h1>'+esc(A.title)+'</h1><div class="card"><h3>How it works</h3>'+A.teach+'</div>'+
     '<button class="btn" id="go" type="button">Start practice</button>'+credit();
    $('#go').onclick=function(){show();};
  }
  function dots(){var d=Math.min(countDone(),A.items.length);return '<div class="dots" aria-hidden="true">'+A.items.map(function(x,i){
    return '<i class="'+(i<d?'on':i===d?'cur':'')+'"></i>';}).join('')+'</div>';}
  function countDone(){var n=0;for(var i=0;i<pos;i++)if(!queue[i].easy)n++;return n;}
  function head(){return top('Practice · '+A.title)+dots();}
  function show(){
    clear();tries=0;
    if(pos>=queue.length)return end();
    var it=queue[pos];
    if(it.easy)return showEasy(it);
    var html=head()+'<div class="card"><p class="mut" style="margin:0">Tense: '+esc(A.tense)+(it.verb?' · verb: <span class="it" lang="it">'+esc(it.verb)+'</span>':it.k==='andare'?' · verb: <span class="it" lang="it">andare</span>':it.k==='volere'?' · verb: <span class="it" lang="it">volere</span>':'')+'</p>'+
     '<p class="sent" lang="it">'+esc(it.b)+' <span class="blank" id="blank">&nbsp;</span> '+esc(it.a)+'</p><p class="en">'+esc(it.en)+'</p>';
    if(it.mode==='choose'){
      html+='<p style="margin-top:12px">Choose the form that fits.</p><div class="opts">'+options(it).map(function(o){return '<button class="opt" type="button" lang="it" data-o="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div>';
    }else{
      html+='<label class="f" for="ans">Type the form that fits.</label><input type="text" id="ans" lang="it" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">'+accRow()+
       '<button class="btn" id="chk" type="button">Check</button>';
    }
    html+='<div id="fb" aria-live="polite"></div></div>';
    app.innerHTML=html;
    if(it.mode==='choose'){$$('.opt',app).forEach(function(b){b.onclick=function(){judge(it,b.getAttribute('data-o'),b);};});}
    else{var inp=$('#ans');inp.focus();$('#chk').onclick=function(){judge(it,inp.value,null);};inp.onkeydown=function(e){if(e.key==='Enter')judge(it,inp.value,null);};}
  }
  function lock(){$$('.opt,#chk,#ans',app).forEach(function(e){e.disabled=true;});}
  function judge(it,raw,btn){
    var right=answer(it),fb=$('#fb');
    if(norm(raw)===right){
      if(tries===0){missRun=0;if(!it.again)firstTry++;}
      lock();if(btn)btn.classList.add('right');$('#blank').textContent=right;
      fb.innerHTML='<div class="fb ok"><b>Correct.</b><div class="tip">Remember: <span lang="it">'+esc(A.tip)+'</span></div></div>';
      timer=setTimeout(next,2200);return;
    }
    tries++;
    if(btn){btn.disabled=true;btn.classList.add('off');}
    if(tries===1){
      missRun++;
      fb.innerHTML='<div class="fb"><b>Not yet. Here is why:</b> '+esc(why(it,raw))+'<div class="tip">Try one more time.</div></div>';
      var inp=$('#ans');if(inp){inp.select();}
      return;
    }
    lock();$('#blank').textContent=right;
    $$('.opt',app).forEach(function(b){if(b.getAttribute('data-o')===right)b.classList.add('right');});
    fb.innerHTML='<div class="fb"><b>Why:</b> '+esc(why(it,raw))+'<div class="tip">The answer is <b class="ans" lang="it">'+esc(right)+'</b>. You will see this one again.</div>'+
     '<div class="tip">Remember: <span lang="it">'+esc(A.tip)+'</span></div></div><button class="btn" id="nx" type="button">Next</button>';
    if(!it.again){var c={};for(var k in it)c[k]=it[k];c.again=true;queue.push(c);}
    $('#nx').onclick=next;$('#nx').focus();
  }
  function next(){
    clear();pos++;
    if(missRun>=2&&easyUsed<A.easy.length){
      missRun=0;var add=[];
      for(var i=0;i<2&&easyUsed<A.easy.length;i++){add.push({easy:A.easy[easyUsed++]});}
      queue.splice.apply(queue,[pos,0].concat(add));
    }
    show();
  }
  function showEasy(it){
    var e=it.easy,opts=Math.random()<.5?[e[1],e[2]]:[e[2],e[1]];
    app.innerHTML=head()+'<div class="card"><p class="mut" style="margin:0">Quick one</p><p class="sent">'+esc(e[0])+'</p>'+
     '<div class="opts">'+opts.map(function(o){return '<button class="opt" type="button" lang="it" data-o="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div><div id="fb" aria-live="polite"></div></div>';
    $$('.opt',app).forEach(function(b){b.onclick=function(){
      if(b.getAttribute('data-o')===e[1]){lock();b.classList.add('right');$('#fb').innerHTML='<div class="fb ok"><b>Correct.</b></div>';timer=setTimeout(next,1300);}
      else{b.disabled=true;b.classList.add('off');$('#fb').innerHTML='<div class="fb">Not that one. Tap the other one.</div>';}
    };});
  }
  function end(){
    var n=A.items.length;
    app.innerHTML=top('Practice · '+A.title)+'<h1>Practice finished</h1><div class="card"><p class="sent">'+firstTry+' of '+n+' right on the first try</p>'+
     '<p>'+(firstTry===n?'Every form was right the first time.':'Every form you missed came back until you had it. Play again to raise your first-try number.')+'</p>'+
     '<p class="mut">This practice is not graded.</p></div><div class="row"><button class="btn" id="again" type="button">Practice again</button><a class="btn ghost" href="#home">Back to the project</a></div>'+credit();
    $('#again').onclick=function(){practice(key);};
  }
  intro();
}

  var verbs={},persons={};
  ARE.forEach(function(v){var f=conj(v);[0,1,3].forEach(function(p){if(has(f[p])){verbs[v]=1;persons[P[p]]=1;}});});
  var qa=0,qb=0,filled=0;
  txt.forEach(function(l,i){if(l.trim())filled++;var q=(l.match(/\?/g)||[]).length;if(i%2===0)qa+=q;else qb+=q;});
  return {filled:filled,verbs:Object.keys(verbs),persons:persons,
    andare:['vado','vai','andiamo'].filter(has),volere:['voglio','vuoi','vogliamo'].filter(has),qa:qa,qb:qb};
}

     '<div class="card"><h3>Your script</h3>'+accRow()+'<div id="lines">'+linesHtml()+'</div>'+
     '<div class="row" style="margin-top:10px"><button class="btn ghost small" id="add" type="button"'+(S.n>=16?' disabled':'')+'>Add a line</button><button class="btn ghost small" id="rem" type="button"'+(S.n<=12?' disabled':'')+'>Remove the last line</button><span class="mut">'+S.n+' of 16 lines</span></div></div>'+
     '<div class="card"><h3>Checklist</h3><p class="mut">The gray notes are a helper that looks for words in your script. It can miss things. Your teacher grades the real script.</p>'+
     CHECKLIST.map(function(c){return '<label class="check"><input type="checkbox" data-c="'+c[0]+'"'+(S.ticks[c[0]]?' checked':'')+'><span>'+esc(c[1])+'<span class="found" id="f-'+c[0]+'"></span></span></label>';}).join('')+'</div>'+
     '<div class="card"><h3>Turn in: the script</h3><p>Copy your script and paste it into the Google Classroom assignment, or print it or save it as a PDF.</p>'+
     '<p class="warn" id="msg" aria-live="polite"></p><div class="row"><button class="btn" id="copy" type="button">Copy my script</button><button class="btn ghost" id="pr" type="button">Print or save as PDF</button></div></div>'+credit();
    refreshFound();
    $('#p1').onchange=function(){S.p1=this.value;save();draw();};
    $('#p2').onchange=function(){S.p2=this.value;save();draw();};
    $$('[data-l]',app).forEach(function(el){el.oninput=function(){S.lines[+el.getAttribute('data-l')]=el.value;save();refreshFound();};});
    $$('[data-c]',app).forEach(function(el){el.onchange=function(){S.ticks[el.getAttribute('data-c')]=el.checked;save();};});
    $('#add').onclick=function(){if(S.n<16){S.n++;save();draw();var e=$('#l'+(S.n-1));if(e)e.focus();}};
    function dropLine(){if(S.n>12){S.lines[S.n-1]='';S.n--;save();draw();}}
    if((S.lines[S.n-1]||'').trim())twoTap($('#rem'),'Line '+S.n+' has writing. Tap again to remove it',dropLine);else $('#rem').onclick=dropLine;
    function text(){var out='Facciamo un piano! · '+(S.p1||'Partner A')+' e '+(S.p2||'Partner B')+'\n\n';for(var i=0;i<S.n;i++){if((S.lines[i]||'').trim())out+=nameOf(i)+': '+S.lines[i].trim()+'\n';}return out;}
    function status(){var r=scan(),un=CHECKLIST.filter(function(c){return !S.ticks[c[0]];}).length;var m=[];
      if(r.filled<12)m.push('Only '+r.filled+' lines are written. You need 12 to 16.');
      if(un)m.push(un+' checklist item'+(un>1?'s are':' is')+' not ticked yet.');return m.join(' ');}
    $('#copy').onclick=function(){var t=text(),m=$('#msg'),s=status();
      function ok(){m.textContent='Copied. Paste it into Google Classroom. '+s;}
      function manual(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();var done=false;try{done=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);
        if(done)ok();else m.textContent='Copy did not work on this device. Use Print or save as PDF.';}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,manual);}else manual();};
    $('#pr').onclick=function(){$('#msg').textContent=status();var h='<p><span class="pl">Partners:</span> '+esc(S.p1)+' e '+esc(S.p2)+'</p>';
      for(var i=0;i<S.n;i++){h+='<div class="pbox"><span class="pl">'+(i+1)+'. '+esc(nameOf(i))+':</span> '+esc(S.lines[i]||'')+'</div>';}
      h+='<p class="pl">Checklist</p>'+CHECKLIST.map(function(c){return '<p>['+(S.ticks[c[0]]?'x':' ')+'] '+esc(c[1])+'</p>';}).join('');doPrint(h);};
  }
  draw();
};

/* Day 3 */
SCREENS.step3=function(){
  function words(s){return (s||'').trim().split(/\s+/).filter(Boolean).length;}
  app.innerHTML=top('Day 3')+'<h1>Perform it</h1>'+
   '<p>Perform your conversation live, or record it. Do not read your script. Use a cue card with key words only, so it stays a real conversation.</p>'+
   '<div class="card"><h3>Your cue card</h3><p class="mut">Up to 8 boxes. 3 words or fewer in each box. No full sentences.</p>'+accRow()+
   '<div class="grid">'+[0,1,2,3,4,5,6,7].map(function(i){return '<div><label class="f" for="c'+i+'">Key words '+(i+1)+'</label><input type="text" id="c'+i+'" lang="it" data-q="'+i+'" value="'+esc(S.cue[i]||'')+'" autocomplete="off"><span class="warn" id="w'+i+'"></span></div>';}).join('')+'</div>'+
   '<div class="row" style="margin-top:14px"><button class="btn ghost" id="pr" type="button">Print my cue card</button></div></div>'+
   '<div class="card"><h3>Before you perform</h3>'+
   ['Look at your partner, not at the card.','React to what your partner says: <span class="it" lang="it">Va bene!</span> <span class="it" lang="it">Perfetto!</span> <span class="it" lang="it">Sì, volentieri!</span>','Speak slowly and clearly. Aim for 1 to 2 minutes.'].map(function(t){return '<p>'+t+'</p>';}).join('')+'</div>'+
   '<div class="card"><h3>Turn in: the performance or recording</h3><p>If you perform live, your teacher grades you in class. If you record, use the recorder your teacher tells you to use and add the recording to the Google Classroom assignment. This page does not record you.</p>'+
   '<a class="btn ghost" href="rubric.html">See how you are graded</a></div>'+credit();
  function chk(i){var n=words(S.cue[i]);$('#w'+i).textContent=n>3?'Too long: '+n+' words. Use 3 or fewer.':'';}
  $$('[data-q]',app).forEach(function(el){var i=+el.getAttribute('data-q');chk(i);el.oninput=function(){S.cue[i]=el.value;save();chk(i);};});
  $('#pr').onclick=function(){doPrint('<p><span class="pl">Cue card:</span> '+esc(S.p1)+' e '+esc(S.p2)+'</p>'+[0,1,2,3,4,5,6,7].map(function(i){return '<div class="pbox"><span class="pl">'+(i+1)+'.</span> '+esc(S.cue[i]||'')+'</div>';}).join(''));};
};
