/* ===== mistake patterns + check-in ===== */
function pairKey(a,b){return [a,b].sort((x,y)=>PK.indexOf(x)-PK.indexOf(y)).join('|')}
function patOf(v,p,raw,r){const d=V[v];if(r.plainE)return 'e-è';const T=r.T||norm(raw),b=base(T);
 if(!T)return 'end:'+p;if(b===v)return 'inf';if(d.iare&&/ii/.test(b))return 'one-i';
 const hit=FORMS[b];if(hit){const same=hit.filter(h=>h.v===v&&h.p!==p);if(same.length)return 'pair:'+pairKey(p,same[0].p);
  const other=hit.filter(h=>h.v!==v);if(other.length)return 'mix'}
 return d.irr?'irr:'+v:'end:'+p}
function missPA(s){if(s.k==='choice'){const ok=s.opts.find(o=>o.ok);return{p:s.q.replace(/<[^>]+>/g,''),a:ok?ok.t.replace(/<[^>]+>/g,''):''}}return{p:qPrompt(s),a:qAnswer(s)}}
function noteMiss(key,s){if(!run)return;run.patTot[key]=(run.patTot[key]||0)+1;run.pat[key]=(run.pat[key]||0)+1;run.row++;run.patCtx[key]={v:s.v,p:s.p};
 const m=missPA(s);if(!run.miss.some(x=>x.p===m.p))run.miss.push({p:m.p,a:m.a,key});
 if(!run.ci&&(run.pat[key]>=2||run.row>=3)){run.ci={key,v:s.v,p:s.p,why:run.pat[key]>=2?'twice':'row'};run.pat[key]=0;run.row=0}}
function exRow(v,p){const d=V[v],i=PK.indexOf(p);return '<div class="vrow"><small class="who">'+LAB[p]+'</small>'+vb(v,p)+'<small>= '+d.eng[i]+'</small></div>'}
function patExplain(key,v,p){
 const rv=(v&&V[v]&&!V[v].irr)?v:'parlare';
 if(key==='e-è')return{title:'è (is) vs e (and)',html:'<p class="ci-t"><b lang="it">è</b> with the accent means “is”. <b lang="it">e</b> without the accent means “and”. A missing accent never loses points, except this one.</p><div class="vrow" lang="it">Marco è a scuola e ha un quaderno.</div><p class="ci-t">Marco is at school <b>and</b> has a notebook. If you can say “is” in English, write <b lang="it">è</b>.</p>'};
 if(key==='one-i')return{title:'only one i in studiare and mangiare',html:'<p class="ci-t">The root of these two verbs already ends in i. So <b>tu</b> and <b>noi</b> keep just one i: never two.</p>'+exRow('studiare','tu')+exRow('studiare','noi')+exRow('mangiare','tu')+exRow('mangiare','noi')};
 if(key==='inf')return{title:'the “to” form vs the form that shows who',html:'<p class="ci-t">The <b>are</b> at the end acts like the word <b>TO</b> (<span lang="it">mangiare</span> = to eat). To say who does it, keep the bold underlined root and use the ending for that person.</p>'+exRow(rv,'io')+exRow(rv,'noi')};
 if(key==='mix')return{title:'essere (to be) vs avere (to have)',html:'<p class="ci-t">Ask yourself: if English says <b>am / is / are</b>, use <b lang="it">essere</b>. If English says <b>have / has</b>, use <b lang="it">avere</b>. Neither one uses the -are endings.</p>'+exRow('essere',p||'io')+exRow('avere',p||'io')};
 if(key.indexOf('irr:')===0){const iv=key.slice(4);return{title:iv+': learn the forms by heart',html:'<p class="ci-t"><span lang="it">'+iv+'</span> is not an -are verb, so there is no root and ending to build. Learn the six forms.</p>'+PK.map(q=>exRow(iv,q)).join('')}}
 if(key.indexOf('pair:')===0){const [a,b]=key.slice(5).split('|');
  const nv=(v&&V[v]&&V[v].irr)?v:rv;
  let tip='Look at the ending, not at the English. <b>'+LAB[a]+'</b> ends in <b>-'+ENDLAB[PK.indexOf(a)]+'</b>. <b>'+LAB[b]+'</b> ends in <b>-'+ENDLAB[PK.indexOf(b)]+'</b>.';
  if(key==='pair:noi|voi')tip+=' <b>Noi</b> = I am in the group (we). <b>Voi</b> = I am talking to the group (you all).';
  if(key==='pair:lui|loro')tip+=' <b>-a</b> is one person. <b>-ano</b> is more than one.';
  if(V[nv].irr)tip='<span lang="it">'+nv+'</span> does not use the -are endings. Compare these two forms.';
  return{title:LAB[a]+' vs '+LAB[b],html:'<p class="ci-t">'+tip+'</p>'+exRow(nv,a)+exRow(nv,b)}}
 if(key==='drop-pronoun')return{title:'dropping io, tu, noi…',html:'<p class="ci-t">The ending already shows who, so Italian usually drops the pronoun. <span lang="it">Studio la storia</span> already means “I study history”.</p>'+exRow('studiare','io')};
 const pp=p||'noi',vv=(v&&V[v]&&!V[v].irr)?v:'parlare';
 return{title:'the ending for '+LAB[pp],html:'<p class="ci-t">For <b>'+LAB[pp]+'</b> ('+ENG[pp]+') the ending is <b>-'+ENDLAB[PK.indexOf(pp)]+'</b>. Here are all six forms of <span lang="it">'+vv+'</span>.</p>'+PK.map(q=>exRow(vv,q)).join('')}}
function showCheckin(c){view='checkin';const ex=patExplain(c.key,c.v,c.p);run.cis.push(ex.title);
 const last=run.miss.slice(-2);
 paint(hdr('Parts','parts',PARTS[run.n].t,'Part '+(run.n+1)+' · check-in')+dots(run.n)+stage('finger-up',c.why==='twice'?'Let’s check in. You missed this pattern twice.':'Let’s check in. That was three misses in a row.')
 +'<div class="lz-card ci"><h3 class="dsp">Check-in: '+ex.title+'</h3>'+ex.html+(last.length?'<div class="hl-list">'+last.map(x=>'<div><b>'+esc(x.p)+'</b><span lang="it">'+esc(x.a)+'</span></div>').join('')+'</div>':'')+'</div><div class="grow"></div><button class="lz-btn" id="ci" data-act="ciok">Got it, keep going ›</button>','#ci')}
/* ===== the ladder: 8 rungs, pass a rung with 85% (Boh italiano2 pass rule) ===== */
function ladderHTML(hi,compact){const n=mem.done.reduce((a,b)=>a+b,0),c=hi==null?curPart():hi;
 return '<div class="ladder'+(compact?' sm':'')+'" role="img" aria-label="Ladder: '+n+' of 8 rungs climbed">'+[0,1,2,3,4,5,6,7].map(i=>'<div class="rg '+(mem.done[i]?'on':(i===c?'cur':''))+'" style="height:'+((compact?30:36)+i*(compact?8:12))+'px"><b>'+(i+1)+'</b></div>').join('')+'</div>'}
function itemsHTML(items){return '<div class="hl-list">'+items.map(x=>'<div><b>'+esc(x.p)+'</b><span lang="it">'+esc(x.a)+'</span></div>').join('')+'</div>'}
function topKey(keys){let b=null,m=0;for(const k in keys)if(keys[k]>m){m=keys[k];b=k}return b}
function helpHTML(c){const n=c.n;
 if(c.was)return{h:'<div class="hl-card"><b class="hl-h">Not 85% this time</b><p>Your rung stays climbed. You can try again any time.</p></div>',gate:false};
 const items=c.items.slice(0,3);
 if(n<=1)return{h:'<div class="hl-card"><b class="hl-h">'+(c.pct>=70?'So close!':'Not yet.')+'</b><p>You need '+c.need+' more '+c.unit+' to pass.</p><p class="hl-s">Read your missed items, then try again.</p>'+itemsHTML(items)+'</div>',gate:false};
 if(n===2){const ex=patExplain(c.key||('end:'+(c.p||'noi')),c.v,c.p);const gate=!c.noBtn&&!c.helpDone;
  return{h:'<div class="hl-card hl-v"><b class="hl-h">Review with Boh · 1 min</b><p><b>'+ex.title+'</b></p>'+ex.html+itemsHTML(items)+(c.noBtn?'':'<button class="hl-btn" data-act="hl">'+(c.helpDone?'Done ✓ Read it again':'I read it and said each one out loud')+'</button>')+'</div>',gate}}
 if(n===3){const gate=!c.noBtn&&!c.helpDone;
  return{h:'<div class="hl-card hl-n"><b class="hl-h">Write in your notebook</b><p>Copy these <b>by hand</b>.</p>'+itemsHTML(items)+(c.noBtn?'':'<button class="hl-btn" data-act="hl">'+(c.helpDone?'Written ✓ Good!':'I wrote it in my notebook')+'</button>')+'</div>',gate}}
 return{h:'<div class="hl-card hl-p"><b class="hl-h">Ask the Prof</b><p><b>Raise your hand. Show the Prof this screen.</b></p><div class="hl-facts">Round: '+c.label+' · Tries: '+n+' · Best: '+c.best+'%</div>'+itemsHTML(items)+'</div>',gate:false}}
function endPart(){autoCancel();const n=run.n,tot=run.tot,ok=run.ok,frac=tot?ok/tot:1,pct=Math.round(frac*100),need=Math.max(0,Math.ceil(tot*0.85)-ok),pass=frac>=0.85;
 const was=!!mem.done[n];mem.best[n]=Math.max(mem.best[n]||0,pct);let bonus=0;
 if(pass){mem.done[n]=1;delete mem.stuck[n];if(!was)bonus=pay('b'+n,5)}
 else if(!was){const pv=mem.stuck[n]||{n:0,best:0};mem.stuck[n]={n:pv.n+1,best:Math.max(pv.best,pct)}}
 save();run.res={pass,was,pct,need,bonus,ok,tot,n:(mem.stuck[n]||{}).n||0};
 if(pass&&!was&&allPassed())return ladderWin();
 renderEnd()}
function nextTodo(i){for(let j=i+1;j<8;j++)if(!mem.done[j])return j;return -1}
function goNext(j){autoCancel();if(j===7)quizIntro();else startPart(j)}
function renderEnd(){view='partend';const n=run.n,r=run.res,c=run.cis.length?'<p class="lz-note" style="text-align:left">Check-ins today: '+run.cis.map(esc).join(', ')+'.</p>':'';
 const top=hdr('Parts','parts',PARTS[n].t,'Part '+(n+1)+' · '+(r.pass?'rung climbed':'not yet'))+dots(n);
 if(r.pass){const nx=nextTodo(n);
  paint(top+stage('thumbs-up-wink','Rung '+(n+1)+' climbed!')+'<div class="lz-card win"><h3 class="dsp">First try: '+r.ok+' of '+r.tot+' right ('+r.pct+'%)</h3>'+ladderHTML(n)+'<p class="lz-note" style="text-align:left">You needed 85% to climb. '+(r.bonus?'<b>+'+r.bonus+' BC</b> for climbing this rung.':(r.was?'Replay: 0 BC. The rung bonus is paid once.':''))+'</p>'+(r.ok===r.tot?'<p class="lz-note" style="text-align:left">Every card right on the first try. Great work!</p>':'<p class="lz-note" style="text-align:left">The cards you missed came back at the end, so you practiced them twice.</p>')+c+'</div>'
  +(nx>=0?'<p class="lz-note">Next: '+PARTS[nx].t+'. It starts by itself.</p><div id="abw"></div>':'')+'<div class="grow"></div><div class="lz-row"><button class="lz-ghost" data-act="parts">Back to parts</button>'+(nx>=0?'<button class="lz-btn" id="bk" data-act="keep" data-j="'+nx+'">Keep going ›</button>':'')+'</div>',nx>=0?'#bk':null);
  if(nx>=0)autoStart(AUTO.doneNext,()=>{if(view==='partend')goNext(nx)})}
 else{const items=run.miss.map(x=>({p:x.p,a:x.a}));const key=topKey(run.patTot),ctx=key?run.patCtx[key]:{};
  const hp=helpHTML({n:r.n,was:r.was,need:r.need,pct:r.pct,unit:'right',items,key,v:ctx&&ctx.v,p:ctx&&ctx.p,label:PARTS[n].t,best:(mem.stuck[n]||{}).best||r.pct,helpDone:run.helpDone});
  paint(top+stage('finger-up','Not yet. Look at the pink.')+'<div class="lz-card"><h3 class="dsp">First try: '+r.ok+' of '+r.tot+' right ('+r.pct+'%)</h3>'+ladderHTML(n)+'<p class="lz-note" style="text-align:left">You need 85% to climb to the next rung.</p>'+c+'</div>'+hp.h+'<div class="grow"></div>'+(hp.gate?'<p class="lz-note">Do the review first. Then Try again opens.</p>':'')+'<div class="lz-row"><button class="lz-ghost" data-act="parts">Back to parts</button><button class="lz-btn" id="bk" data-act="again"'+(hp.gate?' disabled aria-disabled="true"':'')+'>Try again</button></div>')}}
function ladderWin(){view='win';autoCancel();
 paint(hdr('Parts','parts','The ladder','Top rung reached')+dots(7)+stage('thumbs-up-wink','You did it! You climbed every rung.')+'<div class="lz-card win"><h2 class="dsp">Ladder complete!</h2>'+ladderHTML(7)+'<p class="lz-note" style="text-align:left">All 8 rungs passed with 85% or more: verbs in -are, essere and avere, and the graded quiz.</p><table class="tbl">'+PARTS.map((p,i)=>'<tr><td class="who">'+(i+1)+'</td><td>'+p.t+'</td><td class="en">best '+(mem.best[i]||0)+'%</td></tr>').join('')+'</table></div><div class="grow"></div><button class="lz-btn" id="bk" data-act="parts">Back to parts</button>','#bk')}
function settleQuiz(l){const pct=Math.round(l.score/l.total*100),pass=l.score/l.total>=0.85,was=!!mem.done[7];mem.best[7]=Math.max(mem.best[7]||0,pct);let bonus=0;
 if(pass){mem.done[7]=1;delete mem.stuck[7];if(!was)bonus=pay('b7',5)}
 else if(!was){const pv=mem.stuck[7]||{n:0,best:0};mem.stuck[7]={n:pv.n+1,best:Math.max(pv.best,pct)}}
 l.ladder={pass,was,bonus,pct,n:(mem.stuck[7]||{}).n||0,win:pass&&!was&&allPassed()}}
function quizLadderHTML(l,paid){const g=l.ladder;if(!g)return '';
 if(g.pass)return '<div class="hl-card ok"><b class="hl-h">Rung 8 climbed!</b><p>'+g.pct+'% is 85% or more.'+(paid&&g.bonus?' <b>+'+g.bonus+' BC</b> for climbing this rung.':'')+'</p>'+ladderHTML(7)+(allPassed()?'<button class="lz-btn" data-act="win">See the ladder win ›</button>':'<p class="lz-note">Climb the other rungs to finish the ladder.</p>')+'</div>';
 const miss=l.items.filter(x=>x.c<1),keys={};miss.forEach(x=>{if(x.key)keys[x.key]=(keys[x.key]||0)+1});const key=topKey(keys),first=miss.find(x=>x.key===key)||{};
 const need=Math.ceil((l.total*0.85-l.score)*2)/2,nd=Number.isInteger(need)?String(need):(Math.floor(need)||'')+'½';
 const hp=helpHTML({n:g.n,was:g.was,need:nd,pct:g.pct,unit:'points',items:miss.map(x=>({p:x.prompt,a:x.ans})),key,v:first.v,p:first.p,label:'Quiz',best:(mem.stuck[7]||{}).best||g.pct,noBtn:true});
 return '<div class="lz-card"><h3 class="dsp">Rung 8 needs 85%</h3>'+ladderHTML(7)+'</div>'+hp.h}

/* ===== events ===== */
app.addEventListener('pointerdown',e=>{const a=e.target.closest('[data-acc]');if(a){e.preventDefault();const ti=document.getElementById('ti');if(!ti||ti.disabled)return;const s=ti.selectionStart==null?ti.value.length:ti.selectionStart,en=ti.selectionEnd==null?s:ti.selectionEnd;ti.value=ti.value.slice(0,s)+a.dataset.acc+ti.value.slice(en);ti.focus();ti.setSelectionRange(s+1,s+1)}});
app.addEventListener('click',e=>{
 const a=e.target.closest('[data-acc]');if(a&&e.detail===0){const ti=document.getElementById('ti');if(ti&&!ti.disabled){ti.value+=a.dataset.acc;ti.focus()}return}
 const pb=e.target.closest('[data-part]');if(pb){const i=+pb.dataset.part;if(i===7)quizIntro();else startPart(i);return}
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
 if(act==='parts'){autoCancel();home()}
 else if(act==='next'){advance()}
 else if(act==='ciok'){step()}
 else if(act==='keep'){goNext(+b.dataset.j)}
 else if(act==='hl'){run.helpDone=true;renderEnd()}
 else if(act==='win'){ladderWin()}
 else if(act==='again'){autoCancel();startPart(run.n)}
 else if(act==='teacher')teacher();
 else if(act==='tOpen'){mem.open=true;save();teacher('All parts are open.',true)}
 else if(act==='tReset'){mem.bc=0;mem.done=[0,0,0,0,0,0,0,0];mem.best=[0,0,0,0,0,0,0,0];mem.stuck={};mem.paid={};mem.open=false;mem.nameLocked=false;mem.name='';mem.quiz={used:0,inProgress:false,prog:null,last:null};save();teacher('Everything is reset.',true)}
 else if(act==='qstart')quizStart();
 else if(act==='qnext'){autoCancel();qNext()}
 else if(act==='qlast')quizResult(false);
 else if(act==='qleave')leaveQuiz();
 else if(act==='qstay'){const o=document.getElementById('lvw');if(o)o.remove()}
 else if(act==='qquit'){finalizeProg();quizResult(false)}});
/* ===== boot ===== */
window.AF={get mem(){return mem},AT,AUTO,readMs,patOf,patExplain,ladderHTML,PK,V,formOf,checkTyped,QZ,PARTSTEPS,home,cur:()=>cur,run:()=>run,qz:()=>qz};
load();
try{home()}catch(e){document.body.textContent='Something went wrong. Reload the page.';throw e}
</script></body></html>
